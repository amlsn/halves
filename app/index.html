<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FFF8F4">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Halves">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<title>Halves</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto+Flex:opsz,wdth,wght@8..144,25..151,100..1000&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=block" rel="stylesheet">
<style>
/* ============ Tokens ============
   Skin contract (DESIGN.md §9.8): :root holds the shared defaults = the `modern` skin (V1 look).
   A skin overrides tokens with html[data-skin="<name>"]{…} (light) and
   html[data-skin="<name>"][data-theme="dark"] + @media(prefers-color-scheme:dark){html[data-skin="<name>"]:not([data-theme="light"])}
   (dark). Anything a skin leaves out falls back to modern. Motion tokens (--spring/--spring-soft/--ease) are generated in JS
   from --bounce and data-motion: skins should use them, not redefine them. */
:root,html[data-skin="modern"]{
  --font-ui:"Roboto Flex",system-ui,sans-serif; --font-display:var(--font-ui); --font-num:var(--font-ui);
  --good:#2E6B3F; --good-c:#D7EDD9; --warn:#8A5A00; --warn-c:#FFE7B3; --bad:#B3261E; --bad-c:#F9DEDC;
  --bg:#FFF8F4; --surface:#FFFFFF; --s1:#FBF1EC; --s2:#F5E6DF; --s3:#EDDAD1;
  --text:#231A16; --muted:#6E5D55; --outline:#DCC8BF;
  --primary:#A6431E; --on-primary:#FFFFFF; --primary-c:#FFDBCF; --on-primary-c:#3A0B00;
  --you:#E0602F; --you-c:#FFDBCF; --sam:#12807A; --sam-c:#B9EFE7; --you-t:#A33D14; --sam-t:#0A635D;
  --coral:#FFDBCF; --on-coral:#3A0B00; --teal:#B9EFE7; --on-teal:#00201D;
  --lilac:#E9DDFF; --on-lilac:#21005D; --sun:#FFE08A; --on-sun:#241A00;
  --sage:#D5E8C4; --on-sage:#0F2005; --sky:#D3E4FF; --on-sky:#001C38;
  --scrim:rgba(35,26,22,.38); --shadow:0 8px 28px rgba(80,40,20,.14);
  --r-xl:28px; --r-l:20px; --r-m:14px;
  color-scheme:light;
}
/* Motion tokens. *-fluid / *-step are overwritten by Motion.apply() for the current --bounce (fallbacks = V1 curves). */
:root{
  --bounce:1;
  --spring-fluid:linear(0,0.009,0.035 2.1%,0.141,0.281 6.7%,0.723 12.9%,0.938 16.7%,1.017,1.077,1.121,1.149 24.3%,1.159,1.163,1.161,1.154 29.9%,1.129 32.8%,1.051 39.6%,1.017 43.1%,0.991,0.977 51%,0.974 53.8%,0.975 57.1%,0.997 69.8%,1.003 76.9%,1);
  --spring-soft-fluid:cubic-bezier(.2,1.25,.4,1); --ease-fluid:cubic-bezier(.2,0,0,1);
  --spring-step:steps(7,jump-start); --spring-soft-step:steps(7,jump-start); --ease-step:steps(5,jump-start);
  --spring:var(--spring-fluid); --spring-soft:var(--spring-soft-fluid); --ease:var(--ease-fluid);
  /* V2r1: anything that carries tap targets (sheets, keypad) settles fast with NO overshoot, whatever --bounce says.
     Bounce stays on decoration + navigation. Stop-motion version is stepped but never jumps past rest. */
  --spring-sheet:cubic-bezier(.05,.7,.1,1); --sheet-dur:.2s;
}
/* stop = everything frame-by-frame (~12fps); hybrid = fluid UI, stepped only inside .sm (mascot, celebrations, empty states) */
html[data-motion="stop"],html[data-motion="hybrid"] .sm{--spring:var(--spring-step);--spring-soft:var(--spring-soft-step);--ease:var(--ease-step)}
html[data-motion="stop"]{--spring-sheet:steps(2,jump-start);--sheet-dur:.17s}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){
  --bg:#1A120F; --surface:#231915; --s1:#2B201C; --s2:#352925; --s3:#41332E;
  --text:#F3E2DA; --muted:#C4AEA5; --outline:#57463F;
  --primary:#FFB59C; --on-primary:#5C1A00; --primary-c:#80300F; --on-primary-c:#FFDBCF;
  --you:#FF8F62; --you-c:#6E2A12; --sam:#5ED8CA; --sam-c:#00504A; --you-t:#FFAA85; --sam-t:#7FE6D9;
  --coral:#6E2A12; --on-coral:#FFDBCF; --teal:#00504A; --on-teal:#B9EFE7;
  --lilac:#4A3A78; --on-lilac:#E9DDFF; --sun:#5A4500; --on-sun:#FFE08A;
  --sage:#2F4A1E; --on-sage:#D5E8C4; --sky:#1E3F66; --on-sky:#D3E4FF;
  --good:#8FD6A0; --good-c:#1F3B27; --warn:#F2C46B; --warn-c:#4A3500; --bad:#F2B8B5; --bad-c:#5C1D18;
  --scrim:rgba(0,0,0,.55); --shadow:0 8px 28px rgba(0,0,0,.4); color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#1A120F; --surface:#231915; --s1:#2B201C; --s2:#352925; --s3:#41332E;
  --text:#F3E2DA; --muted:#C4AEA5; --outline:#57463F;
  --primary:#FFB59C; --on-primary:#5C1A00; --primary-c:#80300F; --on-primary-c:#FFDBCF;
  --you:#FF8F62; --you-c:#6E2A12; --sam:#5ED8CA; --sam-c:#00504A; --you-t:#FFAA85; --sam-t:#7FE6D9;
  --coral:#6E2A12; --on-coral:#FFDBCF; --teal:#00504A; --on-teal:#B9EFE7;
  --lilac:#4A3A78; --on-lilac:#E9DDFF; --sun:#5A4500; --on-sun:#FFE08A;
  --sage:#2F4A1E; --on-sage:#D5E8C4; --sky:#1E3F66; --on-sky:#D3E4FF;
  --good:#8FD6A0; --good-c:#1F3B27; --warn:#F2C46B; --warn-c:#4A3500; --bad:#F2B8B5; --bad-c:#5C1D18;
  --scrim:rgba(0,0,0,.55); --shadow:0 8px 28px rgba(0,0,0,.4); color-scheme:dark;
}
.t-coral{--c:var(--coral);--on:var(--on-coral)} .t-teal{--c:var(--teal);--on:var(--on-teal)}
.t-lilac{--c:var(--lilac);--on:var(--on-lilac)} .t-sun{--c:var(--sun);--on:var(--on-sun)}
.t-sage{--c:var(--sage);--on:var(--on-sage)} .t-sky{--c:var(--sky);--on:var(--on-sky)}

/* ============ Base ============ */
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--text);font-family:var(--font-ui);
  font-variation-settings:"opsz" 16;font-size:16px;line-height:1.4;overscroll-behavior:none}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
input{font:inherit;color:inherit}
.ms{font-family:"Material Symbols Rounded";font-weight:normal;font-style:normal;font-size:24px;line-height:1;
  display:inline-block;white-space:nowrap;direction:ltr;-webkit-font-smoothing:antialiased;
  font-variation-settings:"FILL" 0,"wght" 450,"GRAD" 0,"opsz" 24;transition:font-variation-settings .3s var(--ease)}
.ms.fill{font-variation-settings:"FILL" 1,"wght" 500,"GRAD" 0,"opsz" 24}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.shape{clip-path:var(--s,var(--sh-circle));transition:clip-path .6s var(--spring),transform .5s var(--spring)}

/* ============ App shell ============ */
.app{display:grid;grid-template-rows:auto 1fr;height:100dvh;max-width:560px;margin:0 auto;position:relative}
.topbar{display:flex;align-items:center;gap:8px;padding:calc(env(safe-area-inset-top) + 10px) 16px 6px}
.topbar .brand{font-weight:800;font-variation-settings:"wdth" 120,"opsz" 32;font-size:20px;letter-spacing:-.01em;display:flex;align-items:center;gap:8px}
.topbar .brand i{width:22px;height:22px;background:linear-gradient(90deg,var(--you) 50%,var(--sam) 50%);display:inline-block}
.topbar .sp{flex:1}
.icon-btn{width:44px;height:44px;border-radius:22px;display:grid;place-items:center;transition:background .2s,border-radius .4s var(--spring)}
.icon-btn:hover{background:var(--s2)} .icon-btn:active{border-radius:12px;background:var(--s3)}
main{overflow-y:auto;overflow-x:hidden;padding:4px 16px calc(120px + env(safe-area-inset-bottom));view-transition-name:main;scrollbar-width:thin;touch-action:pan-y pinch-zoom}
.rail,.treepane{display:none}

/* bottom floating toolbar + FAB (thumb zone) */
.dock{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom));width:min(528px,calc(100% - 32px));
  display:flex;align-items:center;gap:12px;z-index:20;view-transition-name:dock;pointer-events:none}
.toolbar{pointer-events:auto;flex:1;display:flex;justify-content:space-around;background:var(--s2);border-radius:999px;padding:8px;box-shadow:var(--shadow)}
.tb{display:flex;align-items:center;gap:6px;height:48px;padding:0 14px;border-radius:24px;color:var(--muted);transition:background .35s var(--ease),color .2s,padding .45s var(--spring)}
.tb .lbl{font-weight:600;font-size:14px;max-width:0;overflow:hidden;opacity:0;transition:max-width .45s var(--spring),opacity .2s}
.tb[aria-current="true"]{background:var(--primary-c);color:var(--on-primary-c);padding:0 18px}
.tb[aria-current="true"] .lbl{max-width:90px;opacity:1}
.tb[aria-current="true"] .ms{font-variation-settings:"FILL" 1,"wght" 600,"GRAD" 0,"opsz" 24}
.fab{pointer-events:auto;width:64px;height:64px;background:var(--primary);color:var(--on-primary);display:grid;place-items:center;
  --s:var(--sh-squircle);box-shadow:var(--shadow);filter:drop-shadow(0 6px 14px rgba(160,60,20,.3))}
.fab .ms{font-size:30px;transition:transform .5s var(--spring)}
.fab:hover{--s:var(--sh-cookie6)} .fab:hover .ms{transform:rotate(90deg)}
.fab:active{transform:scale(.9);--s:var(--sh-cookie9)}

/* ============ Shared components ============ */
h2.sec{font-size:13px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:28px 4px 10px;display:flex;align-items:center;gap:8px}
h2.sec .sp{flex:1}
.pill-btn{height:40px;padding:0 16px;border-radius:20px;background:var(--s2);font-weight:600;font-size:14px;display:inline-flex;align-items:center;gap:6px;transition:border-radius .4s var(--spring),background .2s,transform .4s var(--spring)}
.pill-btn:active{border-radius:10px;transform:scale(.96)}
.pill-btn.tonal{background:var(--primary-c);color:var(--on-primary-c)}
.pill-btn.filled{background:var(--primary);color:var(--on-primary)}
.pill-btn .ms{font-size:20px}
.text-btn{font-size:14px;font-weight:600;color:var(--primary);min-height:44px;padding:8px 12px;border-radius:16px;text-transform:none;letter-spacing:0}
.text-btn:hover{background:var(--s2)}

/* hero balance */
.hero{position:relative;overflow:hidden;border-radius:var(--r-xl);padding:22px 22px 18px;margin-top:6px;
  background:var(--hero-bg,var(--primary-c));color:var(--hero-on,var(--on-primary-c));isolation:isolate}
.hero.owe{--hero-bg:var(--sam-c);--hero-on:var(--text)}
.hero.even{--hero-bg:var(--s2);--hero-on:var(--text)}
.hero .blob{position:absolute;right:-50px;top:-40px;width:210px;height:210px;background:var(--hero-on);opacity:.07;z-index:-1;
  --s:var(--sh-cookie9);transition:transform 1.2s var(--spring)}
.hero:hover .blob,.hero:active .blob{transform:rotate(60deg)}
.hero .lbl{font-size:15px;font-weight:600;opacity:.85;display:flex;align-items:center;gap:6px}
.hero .amt{font-size:clamp(48px,15vw,68px);line-height:1.05;margin:6px 0 14px;letter-spacing:-.02em;
  font-variation-settings:"wght" var(--w,800),"wdth" var(--wd,100),"opsz" 144;transition:font-variation-settings .6s var(--spring);cursor:pointer;user-select:none}
.hero .amt:active{--wd:70}
.hero .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.hero .row .pill-btn{background:color-mix(in srgb,var(--hero-on) 12%,transparent)}
.hero .row .pill-btn.filled{background:var(--hero-on);color:var(--hero-bg)}
.hero .ctx{font-size:13px;opacity:.75;margin-left:auto}

/* tree */
.tree{background:var(--surface);border-radius:var(--r-l);padding:6px;border:1px solid var(--s2)}
.node{display:flex;align-items:center;gap:12px;padding:8px 8px 8px calc(8px + var(--depth,0) * 22px);border-radius:16px;position:relative;cursor:pointer;
  transition:background .2s,transform .45s var(--spring);user-select:none}
.node:hover{background:var(--s1)} .node:active{transform:scale(.98)}
.node.child::before{content:"";position:absolute;left:calc(var(--depth) * 22px - 2px);top:-4px;bottom:50%;width:12px;border-left:2px solid var(--outline);border-bottom:2px solid var(--outline);border-bottom-left-radius:10px}
.node .ic{width:42px;height:42px;display:grid;place-items:center;background:var(--c);color:var(--on);flex:none}
.node .ic .ms{font-size:22px}
.node:hover .ic{--s:var(--s-hover,var(--sh-cookie9));transform:rotate(-8deg)}
.node .nm{flex:1;min-width:0}
.node .nm b{display:block;font-weight:650;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.node .nm small{color:var(--muted);font-size:13px}
.node .net{font-size:13px;font-weight:650;text-align:right}
.node .chev{width:44px;height:44px;border-radius:22px;display:grid;place-items:center;color:var(--muted);transition:transform .45s var(--spring),background .2s}
.node .chev:hover{background:var(--s2)}
.node.open .chev{transform:rotate(90deg)}
.node.active{background:var(--primary-c);color:var(--on-primary-c)}
.kids{display:grid;grid-template-rows:0fr;transition:grid-template-rows .45s var(--spring)}
.kids>div{overflow:hidden}
.kids.open{grid-template-rows:1fr}

/* expense rows */
.day{font-size:13px;font-weight:650;color:var(--muted);margin:18px 6px 6px}
.list{display:flex;flex-direction:column;gap:2px}
.row-x{display:flex;align-items:center;gap:12px;padding:10px 10px;border-radius:18px;background:var(--surface);cursor:pointer;
  transition:transform .45s var(--spring),background .2s,border-radius .4s var(--spring)}
.list .row-x:first-child{border-top-left-radius:22px;border-top-right-radius:22px}
.list .row-x:last-child{border-bottom-left-radius:22px;border-bottom-right-radius:22px}
.list .row-x:not(:first-child):not(:last-child){border-radius:6px}
.list .row-x:only-child{border-radius:22px}
.row-x:hover{background:var(--s1)} .row-x:active{transform:scale(.98)}
.row-x .ic{width:44px;height:44px;display:grid;place-items:center;background:var(--c);color:var(--on);flex:none;--s:var(--sh-squircle)}
.row-x:hover .ic{--s:var(--sh-cookie6)}
.row-x .tx{flex:1;min-width:0}
.row-x .tx b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row-x .tx small{color:var(--muted);font-size:13px;display:flex;gap:6px;align-items:center}
.row-x .am{text-align:right;flex:none}
.row-x .am b{display:block;font-weight:650}
.row-x .am small{font-size:12px;font-weight:600}
.pos{color:var(--you-t)} .neg{color:var(--sam-t)}
:focus-visible{outline:3px solid var(--primary);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.dot{width:8px;height:8px;border-radius:4px;display:inline-block;flex:none}
.row-x.new{animation:pop .7s var(--spring)}
@keyframes pop{from{transform:scale(.6) translateY(20px);opacity:0}}
.row-x.settle .ic{--c:var(--s2);--on:var(--text)}

/* folder view */
.crumbs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;margin:4px -16px 0;padding:0 16px}
.crumb{height:40px;padding:0 14px;border-radius:20px;background:var(--s1);font-size:13px;font-weight:600;white-space:nowrap;display:flex;align-items:center;gap:4px;flex:none}
.crumb:last-child{background:none;color:var(--muted)}
.crumb-sep{color:var(--outline);display:flex;align-items:center}
.fhead{display:flex;align-items:flex-start;gap:14px;margin:18px 0 6px}
.fhead .ic{width:64px;height:64px;display:grid;place-items:center;background:var(--c);color:var(--on);flex:none;--s:var(--sh-cookie9)}
.fhead .ic:hover{transform:rotate(14deg);--s:var(--sh-flower)}
.fhead .ic .ms{font-size:32px}
.fhead h1{margin:0;font-size:34px;line-height:1.1;font-variation-settings:"wght" 760,"wdth" 112,"opsz" 60;letter-spacing:-.015em}
.fhead .meta{font-size:14px;color:var(--muted);margin-top:4px}
.fnet{margin:16px 2px 4px}.fnet small{display:block;font-size:13px;font-weight:650;color:var(--muted)}.fnet b{font-size:32px;font-variation-settings:"wght" 760,"opsz" 60}.fnet span{font-size:13px;color:var(--muted)}
.fstats{display:flex;gap:8px;margin:14px 0 4px;flex-wrap:wrap}
.stat{flex:1;min-width:120px;background:var(--surface);border-radius:var(--r-l);padding:12px 14px;border:1px solid var(--s2)}
.stat small{display:block;font-size:12px;color:var(--muted);font-weight:600}
.stat b{font-size:22px;font-variation-settings:"wght" 700,"opsz" 40}
.subs{display:flex;gap:10px;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:2px 16px 4px}
.subtile{flex:none;width:128px;background:var(--surface);border-radius:var(--r-l);padding:12px;text-align:left;border:1px solid var(--s2);transition:transform .45s var(--spring),border-radius .4s var(--spring)}
.subtile:hover{border-radius:28px} .subtile:active{transform:scale(.95)}
.subtile .ic{width:40px;height:40px;display:grid;place-items:center;background:var(--c);color:var(--on);margin-bottom:10px}
.subtile b{display:block;font-size:15px;font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.subtile small{font-size:12px;color:var(--muted)}
.subtile.add{border-style:dashed;border-color:var(--outline);display:flex;flex-direction:column;justify-content:center;align-items:center;gap:6px;color:var(--muted);background:none}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:14px -16px 0;padding:0 16px}
.chip{height:40px;padding:0 14px;border-radius:12px;border:1px solid var(--outline);font-size:13px;font-weight:600;display:inline-flex;align-items:center;gap:6px;flex:none;
  transition:border-radius .4s var(--spring),background .2s,border-color .2s}
.chip .ms{font-size:18px}
.chip[aria-pressed="true"]{background:var(--primary-c);color:var(--on-primary-c);border-color:transparent;border-radius:20px}
.empty{text-align:center;padding:40px 20px;color:var(--muted)}
.empty .shape{width:96px;height:96px;margin:0 auto 14px;background:var(--s2);display:grid;place-items:center;--s:var(--sh-flower)}

/* insights */
.bars{display:flex;flex-direction:column;gap:10px;background:var(--surface);padding:16px;border-radius:var(--r-l);border:1px solid var(--s2)}
.bar{display:grid;grid-template-columns:28px 1fr auto;gap:10px;align-items:center;font-size:14px}
.bar .track{height:14px;border-radius:7px;background:var(--s1);overflow:hidden}
.bar .fill{height:100%;border-radius:7px;background:var(--c);width:0;transition:width 1s var(--spring)}
.split-bar{display:flex;height:48px;border-radius:24px;overflow:hidden;gap:4px;margin:8px 0}
.split-bar div{display:flex;align-items:center;padding:0 14px;font-weight:700;font-size:14px;border-radius:8px}
.split-bar div:first-child{background:var(--you-c);color:var(--text);box-shadow:inset 4px 0 0 var(--you);border-radius:24px 8px 8px 24px}
.split-bar div:last-child{background:var(--sam-c);color:var(--text);box-shadow:inset -4px 0 0 var(--sam);border-radius:8px 24px 24px 8px;justify-content:flex-end}

/* ============ Sheet ============ */
.scrim{position:fixed;inset:0;background:var(--scrim);opacity:0;pointer-events:none;transition:opacity .3s;z-index:40}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:50%;bottom:0;width:min(560px,100%);max-height:94dvh;background:var(--surface);z-index:41;
  border-radius:var(--r-xl) var(--r-xl) 0 0;transform:translate(-50%,105%);transition:transform var(--sheet-dur) var(--spring-sheet);
  display:flex;flex-direction:column;padding-bottom:env(safe-area-inset-bottom);box-shadow:var(--shadow)}
.sheet.on{transform:translate(-50%,0)}
.sheet.dragging{transition:none}
.grab{padding:10px 0 4px;display:grid;place-items:center;cursor:grab;touch-action:none}
.grab i{width:36px;height:5px;border-radius:3px;background:var(--outline)}
.sheet-body{overflow-y:auto;padding:0 16px 16px}
.sheet h3{margin:4px 4px 14px;font-size:22px;font-variation-settings:"wght" 700,"wdth" 110,"opsz" 32}

/* add expense */
.ae-top{display:flex;align-items:center;gap:8px;margin:2px 0 4px}
.ae-top input{flex:1;border:0;background:var(--s1);border-radius:16px;height:48px;padding:0 16px;font-size:16px;transition:border-radius .4s var(--spring),background .2s}
.ae-top input:focus{border-radius:24px;background:var(--s2)}
.amt-disp{display:flex;align-items:baseline;justify-content:center;gap:4px;padding:18px 0 10px;cursor:pointer}
.amt-disp .cur{font-size:28px;font-weight:500;color:var(--muted)}
.amt-disp .v{font-size:64px;line-height:1;letter-spacing:-.02em;font-variation-settings:"wght" var(--w,300),"wdth" var(--wd,100),"opsz" 144;transition:font-variation-settings .45s var(--spring)}
.amt-disp.zero .v{color:var(--muted)}
.amt-disp.shake{animation:shake .4s}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.owe-line{text-align:center;font-size:14px;color:var(--muted);min-height:20px;margin-bottom:6px}
.owe-line b{color:var(--text)}
.dchips{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin:6px 0 12px}
.dchip{height:40px;padding:0 14px 0 7px;border-radius:20px;background:var(--s1);font-size:13px;font-weight:600;display:inline-flex;align-items:center;gap:6px;transition:border-radius .4s var(--spring),background .25s,transform .4s var(--spring)}
.dchip .bub{width:26px;height:26px;display:grid;place-items:center;background:var(--c,var(--s3));color:var(--on,var(--text));--s:var(--sh-cookie6)}
.dchip .bub .ms{font-size:16px}
.dchip[aria-pressed="true"]{background:var(--primary-c);color:var(--on-primary-c);border-radius:10px}
.dchip:active{transform:scale(.94)}
.editor{min-height:248px;position:relative}
.editor>.pane{animation:paneIn .45s var(--spring)}
@keyframes paneIn{from{opacity:0;transform:translateY(14px) scale(.98)}}
/* keypad never moves: a quick fade only, so a practised thumb lands on the right key */
.editor>.pane.keypad{animation:paneFade .12s linear}
@keyframes paneFade{from{opacity:.35}}
.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.key{height:56px;border-radius:28px;background:var(--s1);font-size:26px;font-variation-settings:"wght" 500,"opsz" 40;
  transition:border-radius .35s var(--spring),background .15s,transform .35s var(--spring)}
.key:hover{background:var(--s2)}
.key:active,.key.hit{border-radius:12px;background:var(--s3);transform:scale(.95)}
.key.fn{background:none;color:var(--muted)}
.save{margin-top:12px;width:100%;height:60px;border-radius:30px;background:var(--primary);color:var(--on-primary);font-weight:700;font-size:17px;display:flex;align-items:center;justify-content:center;gap:8px;
  transition:border-radius .4s var(--spring),transform .4s var(--spring),width .5s var(--spring)}
.save:active{border-radius:16px;transform:scale(.98)}
.save.done{width:60px;margin-left:calc(50% - 30px)}
.pane-h{display:flex;align-items:center;justify-content:space-between;margin:0 2px 10px;font-weight:650;color:var(--muted);font-size:14px}

/* button group (paid by) */
.bgroup{display:flex;gap:6px}
.bgroup button{flex:1;height:88px;border-radius:20px;background:var(--s1);font-weight:650;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;
  transition:border-radius .45s var(--spring),background .25s,flex .5s var(--spring),color .2s}
.bgroup button:first-child{border-radius:44px 12px 12px 44px} .bgroup button:last-child{border-radius:12px 44px 44px 12px}
.bgroup button[aria-pressed="true"]{flex:1.35;border-radius:44px;background:var(--pcc);color:var(--text);box-shadow:inset 0 0 0 3px var(--pc)}
.bgroup .av{width:34px;height:34px;display:grid;place-items:center;font-weight:800;font-size:14px;background:var(--pc);color:#fff;--s:var(--sh-cookie9)}
.bgroup .av{color:#1a0f0a}

/* expressive slider */
.xs-wrap{padding:6px 2px}
.xs-labels{display:flex;justify-content:space-between;margin-bottom:10px;align-items:flex-end}
.xs-labels div{display:flex;flex-direction:column}
.xs-labels div:last-child{align-items:flex-end}
.xs-labels small{font-size:12px;font-weight:650;color:var(--muted)}
.xs-labels b{font-size:28px;line-height:1.1;font-variation-settings:"wght" var(--w,500),"opsz" 40;transition:font-variation-settings .3s var(--ease)}
.xs-labels span{font-size:13px;font-weight:600}
.xs{position:relative;height:56px;display:flex;align-items:center;gap:6px;touch-action:none;cursor:pointer;user-select:none}
.xs .a,.xs .b{height:44px;transition:height .35s var(--spring)}
.xs .a{background:var(--you);border-radius:22px 6px 6px 22px;min-width:6px}
.xs .b{background:var(--sam);border-radius:6px 22px 22px 6px;flex:1;min-width:6px}
.xs .h{width:6px;height:56px;border-radius:3px;background:var(--text);flex:none;transition:width .3s var(--spring),height .35s var(--spring)}
.xs.drag .h{width:3px;height:64px} .xs.drag .a,.xs.drag .b{height:36px}
.xs .tick{position:absolute;left:50%;top:50%;width:4px;height:4px;border-radius:2px;background:rgba(255,255,255,.8);transform:translate(-50%,-50%);pointer-events:none}
.presets{display:flex;gap:6px;flex-wrap:wrap;margin-top:14px}
.presets .chip{flex:1;justify-content:center}

/* cat grid */
.catgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.catb{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:6px 0;border-radius:16px}
.catb .ic{width:52px;height:52px;display:grid;place-items:center;background:var(--c);color:var(--on);--s:var(--sh-squircle)}
.catb:hover .ic{--s:var(--sh-cookie6)}
.catb[aria-pressed="true"] .ic{--s:var(--sh-cookie9);transform:rotate(20deg) scale(1.08);outline:3px solid var(--text)}
.catb[aria-pressed="true"]{color:var(--primary)}

.pick-tree .node{padding-top:6px;padding-bottom:6px}
.pick-tree .node .ic{width:34px;height:34px}
.date-row{display:flex;gap:6px;flex-wrap:wrap}
.date-row input{height:44px;border-radius:14px;border:1px solid var(--outline);background:var(--s1);padding:0 12px;flex:1;min-width:160px}

/* new folder */
.field{display:block;margin-bottom:14px}
.field>span{display:block;font-size:13px;font-weight:650;color:var(--muted);margin:0 4px 6px}
.field input[type=text]{width:100%;height:56px;border:0;border-radius:18px;background:var(--s1);padding:0 18px;font-size:18px;font-weight:600;transition:border-radius .4s var(--spring)}
.field input[type=text]:focus{border-radius:28px;background:var(--s2)}
.shapes{display:flex;gap:10px;flex-wrap:wrap}
.shapes button{width:52px;height:52px;display:grid;place-items:center;background:var(--c);color:var(--on)}
.shapes button[aria-pressed="true"]{transform:scale(1.14) rotate(-10deg);outline:3px solid var(--text)}
.suggest{display:flex;align-items:center;gap:12px;background:var(--sun);color:var(--on-sun);padding:12px 14px;border-radius:20px;margin-bottom:14px;animation:pop .6s var(--spring)}
.suggest .tx{flex:1;font-size:14px}
.switch{width:52px;height:32px;border-radius:16px;background:var(--s3);position:relative;flex:none;transition:background .25s}
.switch::after{content:"";position:absolute;left:4px;top:4px;width:24px;height:24px;border-radius:12px;background:var(--muted);transition:transform .45s var(--spring),background .2s,width .3s var(--spring)}
.switch:active::after{width:30px}
.switch[aria-checked="true"]{background:var(--primary)}
.switch[aria-checked="true"]::after{transform:translateX(20px);background:var(--on-primary)}

/* detail */
.det-hero{text-align:center;padding:6px 0 14px}
.det-hero .ic{width:72px;height:72px;margin:0 auto 10px;display:grid;place-items:center;background:var(--c);color:var(--on);--s:var(--sh-cookie9)}
.det-hero .ic .ms{font-size:34px}
.det-hero .v{font-size:48px;font-variation-settings:"wght" 750,"opsz" 144;letter-spacing:-.02em}
.kv{background:var(--s1);border-radius:var(--r-l);padding:4px 16px}
.kv div{display:flex;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid var(--s2);font-size:15px}
.kv div:last-child{border:0}
.kv span{color:var(--muted)}
.actions{display:flex;gap:8px;margin-top:14px}
.actions .pill-btn{flex:1;justify-content:center;height:52px;border-radius:26px}
.menu-list button{display:flex;align-items:center;gap:14px;width:100%;padding:14px 12px;border-radius:16px;font-weight:600;text-align:left}
.menu-list button:hover{background:var(--s1)}
.menu-list .ms{color:var(--muted)}

/* snackbar */
.snack{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));}
body.dial-on .snack{bottom:calc(200px + env(safe-area-inset-bottom))}
.snack{transform:translate(-50%,40px) scale(.9);opacity:0;z-index:60;
  background:var(--text);color:var(--bg);padding:6px 6px 6px 18px;border-radius:18px;display:flex;align-items:center;gap:10px;font-size:14px;font-weight:600;
  transition:transform .5s var(--spring),opacity .25s;max-width:calc(100% - 32px);width:max-content;white-space:nowrap;pointer-events:none}
#snackTx{min-width:0;overflow:hidden;text-overflow:ellipsis}
.snack.on{transform:translate(-50%,0) scale(1);opacity:1;pointer-events:auto}
.snack button{color:var(--primary-c);font-weight:700;padding:10px 12px;border-radius:12px}
.confetti{position:fixed;width:16px;height:16px;z-index:70;pointer-events:none}

/* proto badge */
.proto{position:fixed;top:calc(env(safe-area-inset-top) + 2px);left:50%;transform:translateX(-50%);font-size:9px!important;font-size:11px;font-weight:700;letter-spacing:.08em;
  background:var(--sun);color:var(--on-sun);padding:3px 10px;border-radius:10px;z-index:5;opacity:.85;pointer-events:none}

/* view transitions — V2: spring with overshoot (scales with --bounce) */
::view-transition-old(main){animation-duration:.3s;animation-timing-function:var(--ease)}
::view-transition-new(main){animation-duration:calc(.5s + .15s * var(--bounce));animation-timing-function:var(--spring)}
html[data-dir="fwd"]::view-transition-old(main){animation-name:outL}
html[data-dir="fwd"]::view-transition-new(main){animation-name:inR}
html[data-dir="back"]::view-transition-old(main){animation-name:outR}
html[data-dir="back"]::view-transition-new(main){animation-name:inL}
@keyframes outL{to{opacity:0;transform:translateX(-60px)}} @keyframes inR{from{opacity:0;transform:translateX(70px)}}
@keyframes outR{to{opacity:0;transform:translateX(60px)}} @keyframes inL{from{opacity:0;transform:translateX(-70px)}}

/* ============ Thumb dial (iPod wheel × Camera Control) ============ */
.dial{--dx:calc((100vw - min(528px,100vw - 32px))/2);position:fixed;right:var(--dx);bottom:calc(22px + env(safe-area-inset-bottom));width:148px;height:148px;z-index:45;display:none;
  touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;outline:none;transition:right .45s var(--spring),left .45s var(--spring)}
body.dial-left .dial{right:auto;left:var(--dx)}
body.dial-on .dial{display:block}
body.dial-on .dock .fab{display:none}
body.dial-on .dock .toolbar{margin-right:156px}
body.dial-on.dial-left .dock .toolbar{margin-right:0;margin-left:156px}
body.dial-on main{padding-bottom:calc(196px + env(safe-area-inset-bottom))}
.dial-ring:focus-visible{outline:3px solid var(--primary);outline-offset:4px}
.dial-ring{position:absolute;inset:0;border-radius:50%;background:var(--s3);box-shadow:var(--shadow);transition:background .25s,transform .4s var(--spring)}
.dial-ring::after{content:"";position:absolute;inset:0;border-radius:50%;box-shadow:inset 0 0 0 1px var(--outline)}
.dial.turning .dial-ring{background:var(--primary-c);transform:scale(1.04)}
.dial-ticks{position:absolute;inset:0;transition:transform .12s var(--spring-soft)}
.dial-ticks i{position:absolute;left:50%;top:7px;width:3px;height:10px;margin-left:-1.5px;border-radius:2px;background:var(--muted);transform-origin:50% 67px;opacity:.55}
.dial-ticks i:first-child{background:var(--primary);opacity:1;height:14px;width:4px;margin-left:-2px}
.dial-core{position:absolute;inset:44px;background:var(--primary);color:var(--on-primary);display:grid;place-items:center;--s:var(--sh-cookie9);transition:clip-path .6s var(--spring),transform .3s var(--spring),background .3s}
.dial-core .ms{font-size:28px}
.dial.adjust .dial-core{--s:var(--sh-squircle);background:var(--text);color:var(--bg)}
.dial.commit .dial-core{--s:var(--sh-sunny);background:var(--sun);color:var(--on-sun)}
.dial.pressed .dial-core{transform:scale(.88);--s:var(--sh-flower)}
.dial-bubble{position:absolute;right:0;bottom:calc(100% + 12px);background:var(--text);color:var(--bg);border-radius:18px;padding:8px 14px;white-space:nowrap;text-align:right;
  opacity:0;transform:translateY(10px) scale(.9);transform-origin:bottom right;transition:opacity .2s,transform .45s var(--spring);pointer-events:none;max-width:72vw}
body.dial-left .dial-bubble{right:auto;left:0;text-align:left;transform-origin:bottom left}
.dial-bubble.on{opacity:1;transform:none}
.dial-bubble.pulse{animation:bpulse .4s var(--spring)}
@keyframes bpulse{40%{transform:scale(1.08)}}
.dial-bubble small{display:block;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;opacity:.7}
.dial-bubble b{font-size:20px;font-variation-settings:"wght" 700,"opsz" 40;display:block;overflow:hidden;text-overflow:ellipsis}
.dial-bubble em{font-style:normal;font-size:12px;opacity:.75}
.dial-opt{position:absolute;left:50%;top:50%;width:46px;height:46px;margin:-23px;border-radius:23px;background:var(--surface);color:var(--text);box-shadow:var(--shadow);
  display:grid;place-items:center;opacity:0;transform:scale(.3);transition:transform .45s var(--spring),opacity .2s,background .2s;pointer-events:none}
.dial-opt::after{content:attr(data-name);position:absolute;bottom:calc(100% + 6px);left:50%;transform:translateX(-50%);background:var(--text);color:var(--bg);font-size:11px;font-weight:700;padding:3px 8px;border-radius:8px;white-space:nowrap;opacity:0;transition:opacity .15s}
.dial.menu .dial-opt{opacity:1;transform:translate(var(--x),var(--y))}
.dial.menu .dial-opt.cur{box-shadow:0 0 0 2px var(--primary),var(--shadow)}
.dial.menu .dial-opt.hot{background:var(--primary);color:var(--on-primary);transform:translate(var(--x),var(--y)) scale(1.18)}
.dial.menu .dial-opt.hot::after{opacity:1}
.dial-focus{box-shadow:0 0 0 3px var(--bg),0 0 0 6px var(--primary)!important;position:relative;z-index:1}
.saverow{display:flex;flex-direction:column;justify-content:center;gap:6px;position:sticky;bottom:0;background:var(--surface);padding-bottom:4px;z-index:2}
.dialhint{display:none;font-size:12px;color:var(--muted);line-height:1.45;padding:0 4px}
.dialhint b{color:var(--text)}
.sheet.dialon .saverow{min-height:158px;margin-right:168px;margin-top:4px;justify-content:flex-end}
body.dial-left .sheet.dialon .saverow{margin-right:0;margin-left:168px}
.sheet.dialon .saverow .dialhint{display:block}
.sheet.dialon .saverow .save{width:100%;margin:0}
.ptitle{font-size:34px;margin:14px 4px 0;font-variation-settings:"wght" 760,"wdth" 112,"opsz" 60}
.ptitle+.muted{margin:4px 4px 0;font-size:14px}
.archived{display:flex;align-items:center;gap:10px;width:100%;padding:12px 14px;color:var(--muted);font-size:14px;font-weight:600;border-radius:16px}
.archived:hover{background:var(--s1)}
.hap{position:fixed;left:-99px;top:0;opacity:0;pointer-events:none}
.coach{position:fixed;right:calc((100vw - min(528px,100vw - 32px))/2);bottom:calc(186px + env(safe-area-inset-bottom));z-index:46;background:var(--sun);color:var(--on-sun);
  border-radius:20px 20px 6px 20px;padding:12px 14px;font-size:13px;max-width:240px;box-shadow:var(--shadow);animation:pop .6s var(--spring)}
body.dial-left .coach{right:auto;left:calc((100vw - min(528px,100vw - 32px))/2);border-radius:20px 20px 20px 6px}

.coach button{margin-top:8px;font-weight:700;text-decoration:underline;min-height:32px}
@media (min-width:960px){body.dial-on main{padding-bottom:210px}.dial{right:28px;bottom:28px}body.dial-left .dial{left:124px}.coach{right:28px;bottom:196px}
  .sheet.on ~ .dial{right:492px}.sheet.dialon .save{width:100%;margin-top:12px;margin-left:0!important}.sheet.dialon .saverow{min-height:0;margin:0!important}.sheet.dialon .saverow .dialhint{display:none}}

@media (max-height:720px){.amt-disp{padding:6px 0 2px}.amt-disp .v{font-size:46px}.owe-line{margin-bottom:2px}.ae-top input{height:42px}
  .key{height:44px}.keypad{gap:6px}.dchips{gap:4px;margin:2px 0 6px}.dchip{height:36px;padding-right:12px}.qtitles{margin-bottom:4px}.qtitles button{height:30px}
  .editor{min-height:212px}.dial{width:124px;height:124px}.dial-core{inset:36px}.dial-ticks i{transform-origin:50% 55px}
  .sheet.dialon .saverow{min-height:122px;margin-right:142px}body.dial-left .sheet.dialon .saverow{margin-left:142px}.dial-opt{width:42px;height:42px;margin:-21px}}
/* ============ V2 ============ */
.ptitle,.fhead h1,.sheet h3,.hero .amt,.det-hero .v,.today .big{font-family:var(--font-display)}
/* skin hooks: ornament slots + mascot are inert decoration; the modern skin hides them */
.ornament,.mascot{pointer-events:none}
.mascot{width:var(--mascot-size,64px);height:var(--mascot-size,64px);flex:none}
.hero .mascot,.today .mascot{position:absolute;right:14px;top:14px}
html[data-skin="modern"] :is(.ornament,.mascot){display:none}
/* sheet overshoot: keep paper under the sheet when the spring lifts it */
.sheet::after{content:"";position:absolute;left:0;right:0;top:calc(100% - 2px);height:120px;background:var(--surface)}
/* staggered entrance on navigation (bouncier jumps) */
.in{animation:rowIn calc(.5s + .12s * var(--bounce)) var(--spring) backwards;animation-delay:calc(var(--i,0) * 28ms)}
@keyframes rowIn{from{opacity:0;transform:translateY(calc(10px + 14px * var(--bounce))) scale(.95)}}
.inner{transform-origin:50% 0}
/* page dots (Trends is page 3, reached by swipe / dots / dial) */
.pdots{display:flex;align-items:center;padding:0 2px}
.pdot{width:20px;height:44px;display:grid;place-items:center;border-radius:10px}
.pdot::before{content:"";width:6px;height:6px;border-radius:3px;background:var(--outline);transition:width .45s var(--spring),background .2s}
.pdot[aria-current="true"]::before{width:16px;background:var(--primary)}
/* segmented choice (settings) */
.seg{display:flex;gap:4px}
.seg button{flex:1;min-width:0;height:44px;border-radius:10px;background:var(--s1);font-weight:650;font-size:14px;text-transform:capitalize;
  transition:border-radius .4s var(--spring),background .2s,flex .45s var(--spring),color .2s}
.seg button:first-child{border-radius:22px 10px 10px 22px}.seg button:last-child{border-radius:10px 22px 22px 10px}
.seg button[aria-checked="true"]{background:var(--primary-c);color:var(--on-primary-c);border-radius:22px;flex:1.3}
.set-h{font-size:13px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:22px 4px 10px}
.set-row{margin:0 0 14px}.set-row>.l{display:block;font-size:13px;font-weight:650;color:var(--muted);margin:0 4px 6px}
.set-row .hint{font-size:12px;color:var(--muted);margin:6px 4px 0}
.set-line{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:48px;padding:0 4px;font-weight:600}
.bdemo{height:26px;position:relative;margin:6px 2px 0;border-bottom:2px dashed var(--outline)}
.bdemo i{position:absolute;left:0;top:2px;width:20px;height:20px;border-radius:10px;background:var(--primary);transition:left .8s var(--spring)}
.bdemo.r i{left:calc(100% - 20px)}
.rem-times{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.rem-times .chip{padding-right:4px;gap:2px}.rem-times .chip button{width:32px;height:32px;border-radius:16px;display:grid;place-items:center}
.rem-add{display:flex;gap:8px;margin-top:8px}.rem-add input{height:44px;border-radius:14px;border:1px solid var(--outline);background:var(--s1);padding:0 12px;flex:1}
.days{display:flex;gap:4px;justify-content:space-between}
.days button{width:40px;height:40px;border-radius:20px;background:var(--s1);font-weight:700;font-size:13px;transition:border-radius .35s var(--spring),background .2s}
.days button[aria-pressed="true"]{background:var(--primary-c);color:var(--on-primary-c);border-radius:12px}
/* tags */
.tagrow{display:flex;gap:4px;margin-top:4px;overflow:hidden}
.tagc{font-size:11px;font-weight:650;padding:2px 8px;border-radius:8px;background:var(--s2);color:var(--muted);white-space:nowrap;flex:none}
.tagpick{display:flex;flex-wrap:wrap;gap:6px;max-height:160px;overflow:auto;padding:2px}

<script>
/* V2 boot: resolve prefs before first paint. URL params (?skin=&motion=&bounce=&mode=&theme=) win over stored values
   (so preset links work) and are not persisted; changing a setting in the Settings sheet stores it and drops the URL param. */
const QS=new URLSearchParams(location.search);
const NS='halves.'+(QS.get('frame')||'');
const store={get:k=>{try{return localStorage.getItem(NS+k)}catch(e){return null}},set:(k,v)=>{try{localStorage.setItem(NS+k,v)}catch(e){}}};
const PREF_OPTS={skin:['modern','poster','ink','neon','art'],motion:['fluid','stop','hybrid'],mode:['simple','detailed'],theme:['auto','light','dark'],mascot:['rare','on','off']};
const prefs=(()=>{const p={},cl=v=>Math.max(0,Math.min(2,v));
  for(const k in PREF_OPTS){const u=QS.get(k),s=store.get('pref.'+k);p[k]=PREF_OPTS[k].includes(u)?u:PREF_OPTS[k].includes(s)?s:PREF_OPTS[k][0]}
  const ub=parseFloat(QS.get('bounce')),sb=parseFloat(store.get('pref.bounce'));p.bounce=isFinite(ub)?cl(ub):isFinite(sb)?cl(sb):1;return p})();
(()=>{const r=document.documentElement;r.dataset.skin=prefs.skin;r.dataset.motion=prefs.motion;r.dataset.mode=prefs.mode;r.dataset.mascot=prefs.mascot;
  if(prefs.theme!=='auto')r.dataset.theme=prefs.theme;r.style.setProperty('--bounce',prefs.bounce)})();
</script>

<script>
/* ============ Shapes (M3-expressive-ish polygon library, equal vertex count → morphable) ============ */
const PTS = 96;
function polar(fn){const a=[];for(let i=0;i<PTS;i++){const t=i/PTS*Math.PI*2-Math.PI/2;const r=fn(t);a.push(`${(50+r*Math.cos(t)).toFixed(2)}% ${(50+r*Math.sin(t)).toFixed(2)}%`)}return `polygon(${a.join(',')})`}
const cookie=(n,amp)=>polar(t=>50*(1-amp)+50*amp*Math.cos(n*t));
const squircle=p=>polar(t=>50*Math.pow(Math.pow(Math.abs(Math.cos(t)),p)+Math.pow(Math.abs(Math.sin(t)),p),-1/p)*.98);
const SH={circle:polar(()=>50),squircle:squircle(4),cookie4:cookie(4,.1),cookie6:cookie(6,.08),cookie9:cookie(9,.06),clover:cookie(4,.2),flower:cookie(5,.14),sunny:cookie(12,.04)};
for(const k in SH)document.documentElement.style.setProperty('--sh-'+k,SH[k]);

/* ============ Data ============
   Synced docs (TECH-DESIGN B1) live in these plain arrays; app/sync.js diffs them after every render and syncs the ops.
   In memory, people stay "you" / "sam" (= the partner) so the UI code reads as before; sync maps them to slots A/B at the edge.
   P.sam.name is the partner's real name from /api/me. Ids are random strings (two phones create docs offline). */
const pad2=n=>String(n).padStart(2,'0');
const isoL=d=>d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate());
let TODAY=isoL(new Date());
const DEMO=QS.get('demo')==='1';
const P={you:{name:'You',init:'Y',color:'var(--you)'},sam:{name:'Partner',init:'P',color:'var(--sam)'}};
const CATS={
  groc:{name:'Groceries',icon:'shopping_basket',t:'sage'}, rent:{name:'Rent',icon:'home',t:'sky'},
  food:{name:'Eating out',icon:'ramen_dining',t:'coral'}, travel:{name:'Travel',icon:'flight',t:'teal'},
  bills:{name:'Bills',icon:'bolt',t:'sun'}, fun:{name:'Fun',icon:'local_activity',t:'lilac'},
  shop:{name:'Shopping',icon:'shopping_bag',t:'coral'}, other:{name:'Other',icon:'category',t:'sage'}};
let folders=[], expenses=[], settles=[], TAGS=[], targets=[];
const shared={mode:null}; // pair-wide prefs (kind "pref"); skin/theme/motion/bounce/dial/mascot stay per device
const uid=()=>HalvesSync.rid(12);
const nowISO=()=>{const d=new Date();return isoL(d)+'T'+pad2(d.getHours())+':'+pad2(d.getMinutes())+':'+pad2(d.getSeconds())};
const relTime=at=>{if(!at)return'';const m=Math.round((Date.now()-new Date(at))/6e4);if(m<1)return'just now';if(m<60)return m+'m ago';if(m<20*60)return Math.round(m/60)+'h ago';return dayLbl(at.slice(0,10))};
/* "New from <partner>": when this device last looked (per device; a fresh device starts "seen up to now") */
const SEEN_K=(DEMO?'demo.':'')+'lastSeen';
let lastSeen=store.get(SEEN_K)||(()=>{const n=nowISO();store.set(SEEN_K,n);return n})();
const NOF={id:null,name:'No folder',icon:'folder',shape:'cookie9',t:'sage',parent:null};

/* ============ Helpers ============ */
const $=s=>document.querySelector(s);
const inr=new Intl.NumberFormat('en-IN',{maximumFractionDigits:2});
const money=p=>'₹'+inr.format(Math.round(p)/100);
const money0=p=>'₹'+inr.format(Math.round(p/100));
const F=id=>folders.find(f=>f.id===id);
const kids=id=>folders.filter(f=>f.parent===id);
const desc=id=>[id,...kids(id).flatMap(k=>desc(k.id))];
const path=id=>{const a=[];let f=F(id);while(f){a.unshift(f);f=F(f.parent)}return a};
/* §9.13: each expense is FOR 'both' | 'you' | 'sam'. No splits, balances or settle-ups in this cut.
   Legacy docs (no `for`) read as: one-sided ('sp'==='one') → for the payer; anything else → both. Migrated only when edited. */
const FOR=['both','you','sam'];
const forOf=e=>FOR.includes(e.for)?e.for:e.sp==='one'&&(e.paid==='you'||e.paid==='sam')?e.paid:'both';
const forLbl=w=>w==='both'?'Both':w==='you'?'Me':P.sam.name;
const forA11y=w=>w==='both'?'for both':w==='you'?'for me':'for '+P.sam.name;
const byOf=e=>e.by||e.paid||'you';
/* "to sort" = needs review (untitled / Finish later) only */
const isPend=e=>!!e.review;
const toSort=()=>expenses.filter(isPend).sort((a,b)=>(a.at||a.date).localeCompare(b.at||b.date)); // oldest first = queue order
const sortPill=()=>{const n=toSort().length;return n?`<button class="sortq" data-act="sortq" aria-label="${n} to sort, open the queue">${n} to sort${icon('chevron_right')}</button>`:''};
const UNCAT={name:'Uncategorised',icon:'help',t:'none'};
const catOf=e=>CATS[e&&e.cat]||UNCAT;
const ttl=e=>e.title||'Untitled';
const spend=ids=>{const s=new Set(ids);return expenses.filter(e=>s.has(e.folder)).reduce((a,e)=>a+e.amt,0)};
const dayLbl=d=>{if(d===TODAY)return'Today';const t=new Date(TODAY),x=new Date(d);const diff=(t-x)/864e5;if(diff===1)return'Yesterday';
  return x.toLocaleDateString('en-IN',{weekday:'short',day:'numeric',month:'short'})};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const buzz=(ms=8)=>{try{navigator.vibrate&&navigator.vibrate(ms)}catch(e){}};
const parseL=s=>{const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const icon=(n,fill)=>`<span class="ms${fill?' fill':''}" aria-hidden="true">${n}</span>`;
/* who-it's-for marker (§9.13): Both = two overlapping discs (filled + outlined), Me = filled initial, Partner = outlined initial. Reads in greyscale. */
const forMark=(w,sm,dot)=>dot&&w!=='both'?`<svg class="formk${sm?' sm':''}" viewBox="0 0 26 26" aria-hidden="true">${w==='you'?'<circle cx="13" cy="13" r="8" fill="currentColor"/>':'<circle cx="13" cy="13" r="7.25" fill="none" stroke="currentColor" stroke-width="1.5"/>'}</svg>`
  :w==='both'?`<svg class="formk${sm?' sm':''}" viewBox="0 0 26 26" aria-hidden="true"><circle cx="9.5" cy="10.5" r="8" fill="currentColor" mask="url(#for-m)"/><circle cx="16.5" cy="15.5" r="7.25" fill="none" stroke="currentColor" stroke-width="1.5"/></svg>`
  :`<span class="who ${w}${sm?' sm':''}" aria-hidden="true">${P[w].init}</span>`;
const forSum=list=>{const t={both:0,you:0,sam:0};list.forEach(e=>t[forOf(e)]+=e.amt);return t};
/* slim 3-part breakdown: proportional bar + worded labels. Parts are buttons (data-who); `cur` marks the active filter. */
function forBar(list,{label='By who it’s for',cur=null,cls=''}={}){
  const t=forSum(list),tot=t.both+t.you+t.sam;
  return `<div class="forbar ${cls}" role="group" aria-label="${esc(label)}">
    <div class="fb-track" aria-hidden="true">${tot?FOR.filter(w=>t[w]).map(w=>`<i class="fb-${w}" style="flex:${t[w]}"></i>`).join(''):'<i class="fb-none"></i>'}</div>
    <div class="fb-parts">${FOR.map(w=>`<button class="fb-p" data-who="${w}" ${cur!=null?`aria-pressed="${cur===w}"`:''} aria-label="${esc(forLbl(w))}: ${money0(t[w])}${tot?', '+Math.round(t[w]/tot*100)+'%':''}. Show these">
      ${forMark(w,1,1)}<span class="fb-n">${esc(forLbl(w))}</span><b class="num">${money0(t[w])}</b></button>`).join('')}</div></div>`;
}

/* ============ V2: Motion system ============
   --bounce (0–2) → damping of a spring; we sample it into CSS linear() curves.
   *-fluid = smooth curve, *-step = the same spring held per frame at ~12fps (stop-motion keeps its overshoot).
   data-motion picks which one --spring/--spring-soft/--ease resolve to (see CSS). Motion.boil(el) / .boil = line boil. */
const RM=()=>matchMedia('(prefers-reduced-motion:reduce)').matches;
const Motion=(()=>{
  const R=document.documentElement;let frame=0,timer=null;const subs=[];
  const springX=z=>{const w=5/z,wd=w*Math.sqrt(1-z*z);return t=>1-Math.exp(-z*w*t)*(Math.cos(wd*t)+z*w/wd*Math.sin(wd*t))};
  const smooth=z=>{const x=springX(z),n=72,a=[];for(let i=0;i<n;i++)a.push(i===0?'0':i===n-1?'1':x(i/(n-1)).toFixed(3));return`linear(${a.join(',')})`};
  // first held frame is clamped to ≤ rest, so stop-motion never "teleports" past where things land (later frames may overshoot)
  const stepped=(z,F=7)=>{const x=springX(z),a=[];for(let k=0;k<F;k++){const v=k===F-1?1:k===0?Math.min(1,x(1/F)):x((k+1)/F);a.push(`${v.toFixed(3)} ${(k/F*100).toFixed(2)}%`,`${v.toFixed(3)} ${((k+1)/F*100).toFixed(2)}%`)}return`linear(${a.join(',')})`};
  function apply(){
    const b=RM()?0:prefs.bounce;
    const z=b>0.01?0.9*Math.exp(-0.81*b):0, zs=b>0.01?Math.min(.95,z*1.45):0;
    const set=(k,v)=>R.style.setProperty(k,v);
    set('--bounce',b);
    set('--spring-fluid',z?smooth(z):'cubic-bezier(.2,0,0,1)');
    set('--spring-soft-fluid',zs?smooth(zs):'cubic-bezier(.2,0,0,1)');
    set('--spring-step',stepped(z||.97));set('--spring-soft-step',stepped(zs||.97));set('--ease-step','steps(5,jump-start)');
    sync();
  }
  function tick(){
    if(document.hidden)return;frame=(frame+1)%3;
    const m=R.dataset.motion,els=[...document.querySelectorAll('.boil')].filter(e=>m==='stop'||e.closest('.sm'));
    els.forEach(e=>{e.style.setProperty('--boil',frame);e.style.setProperty('--boil-j',[0,1,-1][frame])});
    if(els.length)document.querySelectorAll('#ink-wobble feTurbulence,#grain feTurbulence').forEach((t,i)=>t.setAttribute('seed',frame+1+i*7));
    subs.forEach(f=>{try{f(frame)}catch(e){}});
  }
  function sync(){const on=R.dataset.motion!=='fluid'&&!RM();
    if(on&&!timer)timer=setInterval(tick,83);
    else if(!on&&timer){clearInterval(timer);timer=null;document.querySelectorAll('.boil').forEach(e=>{e.style.removeProperty('--boil');e.style.removeProperty('--boil-j')})}}
  matchMedia('(prefers-reduced-motion:reduce)').addEventListener?.('change',apply);
  return{apply,sync,
    boil(el){el.classList.add('boil');sync();return()=>el.classList.remove('boil')}, // returns an "unboil" fn
    onFrame(f){subs.push(f)},                       // f(frameIndex) every 83ms while stop/hybrid is on
    get frame(){return frame},
    stepped:el=>R.dataset.motion==='stop'||(R.dataset.motion==='hybrid'&&!!(el&&el.closest&&el.closest('.sm'))),
    easing(el){return this.stepped(el)?'steps(16,jump-end)':'cubic-bezier(.2,.7,.3,1)'}};
})();
Motion.apply();
const emit=(n,d)=>document.dispatchEvent(new CustomEvent('halves:'+n,{detail:d}));

/* ============ V2: modes, tags, targets ============ */
const detailed=()=>prefs.mode==='detailed';
const normTag=s=>String(s||'').trim().toLowerCase().replace(/^#+/,'').replace(/\s+/g,'-').replace(/[^\p{L}\p{N}-]/gu,'').slice(0,20);
function recentTags(){const seen=[];[...expenses].sort((a,b)=>b.date.localeCompare(a.date)||(b.at||'').localeCompare(a.at||'')).forEach(e=>(e.tags||[]).forEach(t=>{if(!seen.includes(t))seen.push(t)}));
  TAGS.forEach(t=>{if(!seen.includes(t))seen.push(t)});return seen}
const tagRow=e=>e.tags&&e.tags.length?`<span class="tagrow">${e.tags.map(t=>`<span class="tagc">#${esc(t)}</span>`).join('')}</span>`:'';
let MONTH,DIM,DAYN,DAYS_LEFT,MONTH_NAME,MON3;
function setDay(){TODAY=isoL(new Date());MONTH=TODAY.slice(0,7);DIM=new Date(+TODAY.slice(0,4),+TODAY.slice(5,7),0).getDate();DAYN=+TODAY.slice(8);DAYS_LEFT=DIM-DAYN+1;
  MONTH_NAME=parseL(TODAY).toLocaleDateString('en-IN',{month:'long'});MON3=MONTH_NAME.slice(0,3)}
setDay();
const visibleTargets=()=>targets.filter(t=>detailed()||t.kind==='overall'||t.kind==='folder').filter(t=>t.kind!=='folder'||(F(t.ref)&&!F(t.ref).archived));
const overallT=()=>targets.find(t=>t.kind==='overall');
function inTarget(e,t){
  if(t.period==='month'&&!e.date.startsWith(MONTH))return false;
  return t.kind==='overall'?true:t.kind==='folder'?desc(t.ref).includes(e.folder):t.kind==='category'?e.cat===t.ref:(e.tags||[]).includes(t.ref);
}
const tItems=t=>expenses.filter(e=>inTarget(e,t));
const tSpent=t=>tItems(t).reduce((a,e)=>a+e.amt,0);
function tName(t,short){
  if(t.kind==='overall')return short?`${MON3} target`:`${MONTH_NAME} · everything`;
  if(t.kind==='folder')return `${F(t.ref).name}${short?' target':''}`;
  if(t.kind==='category')return `${CATS[t.ref].name}${short?' limit':''}`;
  return `#${t.ref}${short?' limit':''}`;
}
function tStat(t,extra=0){
  const spent=tSpent(t)+extra,left=t.amt-spent,pct=t.amt?spent/t.amt:0;
  const st=spent>t.amt?'over':pct>=.85?'warn':'ok';
  const perDay=t.period==='month'?Math.max(0,left)/DAYS_LEFT:null;
  return{spent,left,pct,st,perDay};
}
const ST_LBL={ok:'On track',warn:'Close to limit',over:'Over',inh:'Follows parent'};
const paceTxt=(t,s)=>s.left<0?`over by ${money0(-s.left)}`:t.period==='month'?`${money0(s.left)} left · ${money0(s.perDay)}/day for ${DAYS_LEFT} days`:`${money0(s.left)} left · ${Math.round(s.pct*100)}% used`;
function todayInfo(){
  const t=overallT();if(!t)return null;
  const before=tItems(t).filter(e=>e.date<TODAY).reduce((a,e)=>a+e.amt,0);
  const allowance=Math.max(0,t.amt-before)/DAYS_LEFT;
  const today=expenses.filter(e=>e.date===TODAY).reduce((a,e)=>a+e.amt,0);
  return{t,allowance,today,ok:today<=allowance};
}
function ring(p,st,size=44,sw=5){const r=(size-sw)/2,c=2*Math.PI*r,v=Math.max(0,Math.min(1,p)),h=size/2;
  return`<svg class="ring ${st}" width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" aria-hidden="true"><circle class="trk" cx="${h}" cy="${h}" r="${r}" stroke-width="${sw}"/><circle class="val" cx="${h}" cy="${h}" r="${r}" stroke-width="${sw}" stroke-dasharray="${(c*v).toFixed(1)} ${c.toFixed(1)}" transform="rotate(-90 ${h} ${h})"/></svg>`}
function spark(t,w=84,h=30){
  const items=tItems(t);let pts=[],ideal='';
  if(t.period==='month'){let cum=0;for(let d=1;d<=DAYN;d++){const ds=MONTH+'-'+String(d).padStart(2,'0');cum+=items.filter(e=>e.date===ds).reduce((a,e)=>a+e.amt,0);pts.push(cum)}}
  else{const ds=[...new Set(items.map(e=>e.date))].sort();let cum=0;ds.forEach(d=>{cum+=items.filter(e=>e.date===d).reduce((a,e)=>a+e.amt,0);pts.push(cum)});if(pts.length<2)pts.unshift(0)}
  const N=t.period==='month'?DIM:pts.length,max=Math.max(t.amt,...pts,1),X=i=>(N<2?0:i/(N-1)*(w-4)+2).toFixed(1),Y=v=>(h-2-v/max*(h-4)).toFixed(1);
  ideal=t.period==='month'?`<line class="ideal" x1="2" y1="${h-2}" x2="${w-2}" y2="${Y(t.amt)}"/>`:`<line class="ideal" x1="2" y1="${Y(t.amt)}" x2="${w-2}" y2="${Y(t.amt)}"/>`;
  return`<svg class="spark" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" aria-hidden="true">${ideal}<polyline class="ln" points="${pts.map((v,i)=>X(i)+','+Y(v)).join(' ')}"/></svg>`;
}

/* ============ State & routing ============ */
let route={v:'home'}; const open=new Set(); let catFilter=null; let lastAdded=null;
function go(r,dir='fwd',fromPop){
  if(!fromPop)try{history.pushState({r},'')}catch(e){}
  document.documentElement.dataset.dir=dir; route=r; catFilter=null;
  const run=()=>{render(true);$('#main').scrollTop=0};
  if(document.startViewTransition&&!RM()){const vt=document.startViewTransition(run);vt.ready&&vt.ready.catch(()=>{});vt.finished&&vt.finished.catch(()=>{})}else run();
}
const PAGES=['home','activity','trends'];
const pageOf=v=>v==='folder'||v==='folders'?'home':v==='insights'?'trends':v;
const navDir=to=>PAGES.indexOf(pageOf(to))>PAGES.indexOf(pageOf(route.v))?'fwd':'back';
function render(enter){
  if(route.v==='insights')route={v:'trends'};
  const v=route.v,pg=pageOf(v);
  document.querySelectorAll('[data-nav]').forEach(b=>b.setAttribute('aria-current',String(b.dataset.nav===pg)));
  const html=v==='home'?vHome():v==='folders'?vFolders():v==='folder'?vFolder(route.id):v==='activity'?vActivity():vTrends();
  $('#main').innerHTML=`<div class="inner">${html}</div>`;
  $('#treepane').innerHTML=vTreePane();
  lastAdded=null;dial.idx=-1;
  if(enter&&!RM())[...$('#main .inner').querySelectorAll('.hero,.today,.tgt-card,.drill-sum,.tcard,.tree>.node,.list>.row-x,.subtile,.day,.bars,:scope>.forbar')].slice(0,18)
    .forEach((e,i)=>{e.style.setProperty('--i',i);e.classList.add('in')});
  requestAnimationFrame(()=>document.querySelectorAll('.bar .fill').forEach(b=>b.style.width=b.dataset.w));
  emit('render',{route});
}

/* ============ Views ============ */

function tgtCard(t){const s=tStat(t);

const roots=()=>folders.filter(f=>!f.parent&&!f.archived).sort((a,b)=>(b.pinned|0)-(a.pinned|0));

/* Row = scan unit (§9.1a). Line 1: title + amount (only strong things). Line 2: one muted meta line.
   Who it's FOR = marker in the left column (Simple) or at the start of the meta line (Detailed): Both = two overlapping discs,
   Me = filled initial, Partner = outlined initial (reads in greyscale, §9.13). Folder = small caps under the amount.
   Tags = inline muted #text. Pending = the single accent (left bar + TO SORT). "added by <partner>" only when the partner logged it. */

  spec={kind:spec.kind,ref:spec.ref||null};
  const ex=targets.find(t=>t.kind===spec.kind&&(t.ref||null)===spec.ref);
  if(spec.kind==='folder'&&!F(spec.ref))return;
  const ttl=spec.kind==='overall'?'Monthly target':spec.kind==='folder'?`Target · ${esc(F(spec.ref).name)}`:spec.kind==='category'?`Limit · ${CATS[spec.ref].name}`:`Limit · #${esc(spec.ref)}`;
  const st={amt:ex?ex.amt:({overall:6000000,folder:2500000}[spec.kind]||500000),period:ex?ex.period:(spec.kind==='folder'&&spec.ref!==guessMonthFolder()?'lifetime':'month')};
  const presets=spec.kind==='overall'?[40000,60000,80000]:spec.kind==='folder'?[10000,25000,40000]:[2000,5000,10000];
  openSheet(`<h3>${ttl}</h3>
    <div class="det-hero"><label class="v num" style="display:inline-flex;align-items:baseline;gap:2px;cursor:text">₹<input id="tgIn" inputmode="numeric" aria-label="Target amount" style="border:0;background:none;font:inherit;width:6.5ch;color:inherit;padding:0"></label>

    ${spec.kind==='folder'?`<div class="set-row" style="margin-top:14px"><span class="l">Period</span><div class="seg" role="radiogroup" aria-label="Period">${[['month','Per month'],['lifetime','Whole folder']].map(([v,l])=>`<button role="radio" data-per="${v}" aria-checked="${st.period===v}" style="text-transform:none">${l}</button>`).join('')}</div><div class="hint">Whole folder suits trips: one budget for its lifetime.</div></div>`
      :`<p class="muted" style="font-size:12px;text-align:center">Per calendar month · daily allowance = what's left ÷ days left</p>`}
    ${ex?`<button class="pill-btn" id="tgDel" style="width:100%;justify-content:center;margin-top:10px">${icon('delete')} Remove</button>`:''}
    <button class="save" id="tgGo">${icon('flag')}<span>Save</span></button>`,
  b=>{
    const inp=b.querySelector('#tgIn');

      const tmp={...spec,period:st.period,amt:st.amt||1},s=tStat(tmp);$('#tgSub').textContent=`${money0(s.spent)} spent so far · ${paceTxt(tmp,s)}`};
    upd();
    inp.oninput=()=>{st.amt=Math.round(parseFloat(inp.value.replace(/,/g,''))*100)||0;upd(true)};
    b.querySelectorAll('[data-pv]').forEach(x=>x.onclick=()=>{st.amt=+x.dataset.pv*100;upd();buzz()});
    b.querySelectorAll('[data-per]').forEach(x=>x.onclick=()=>{st.period=x.dataset.per;b.querySelectorAll('[data-per]').forEach(y=>y.setAttribute('aria-checked',y===x));upd()});
    const del=b.querySelector('#tgDel');if(del)del.onclick=()=>{const i=targets.indexOf(ex);targets.splice(i,1);closeSheet();
      if(route.v==='trends'&&route.d&&route.d[0]===ex.id)route={v:'trends'};render();snack('Target removed',()=>{targets.splice(i,0,ex);render()})};
    b.querySelector('#tgGo').onclick=()=>{if(!st.amt){inp.focus();return shakeEl(inp)}
      if(ex){ex.amt=st.amt;ex.period=st.period}else targets.push({id:uid(),...spec,period:st.period,amt:st.amt});

/* ============ V2: nudges (simulated in-browser; see TECH-REVIEW §9 for real platforms) ============ */
let rem=(()=>{try{const r=JSON.parse(store.get('rem'));if(r&&Array.isArray(r.times)&&Array.isArray(r.days))return r}catch(e){}return null})()
  ||{times:['13:30','20:00'],days:[1,1,1,1,1,1,1],style:'banner',demo:false};
const saveRem=()=>store.set('rem',JSON.stringify(rem));
let lastLogAt=null,lastRemAt=Date.now(),nudgeOn=null,nudgeFocus=null,nudgeLast='';
/* V2r2: `still` = the reason to nudge, re-tested at fire time AND on every deferred retry (logging during the wait cancels it).
   Copy counts pending items (no titles, no amounts: still discreet, §9.4) and offers "Finish N" → the To-sort queue. */
function fireNudge(style=rem.style,sub,still){
  if(gated)return;
  if(still&&!still())return;
  if(draft||sheetOpen()){setTimeout(()=>fireNudge(style,sub,still),10000);return} // never interrupt someone mid-log
  hideNudge(true);
  const el=style==='full'?$('#nudgeF'):$('#nudgeB');nudgeOn=el;
  const n=toSort().length;
  el.querySelectorAll('.nudge-sub').forEach(s=>s.textContent=n?`${n} item${n>1?'s':''} to finish${sub?' · '+sub:''}`:sub||(style==='full'?'A good moment to catch up.':'Reminder'));
  el.querySelectorAll('.nudge-fin').forEach(b=>{b.hidden=!n;const t=b.querySelector('.nf-n');if(t)t.textContent=`Finish ${n}`});
  el.inert=false;el.classList.add('on');buzz([20,60,20]);
  if(style==='full'){nudgeFocus=document.activeElement;setTimeout(()=>el.querySelector('[data-nudge="log"]').focus({preventScroll:true}),80)}
  emit('nudge',{style});
}
function hideNudge(silent){
  const wasFull=nudgeOn&&nudgeOn.id==='nudgeF';
  [$('#nudgeB'),$('#nudgeF')].forEach(el=>{el.classList.remove('on');el.inert=true});nudgeOn=null;
  if(wasFull&&!silent&&nudgeFocus&&nudgeFocus.isConnected)nudgeFocus.focus({preventScroll:true});
}
function nudgeAct(a,snz){
  const style=nudgeOn&&nudgeOn.id==='nudgeF'?'full':'banner';hideNudge();
  if(a==='log'){if(sheetOpen())closeSheet();setTimeout(()=>openAdd(),220)}
  else if(a==='sort'){if(sheetOpen())closeSheet();setTimeout(()=>openSortQ(),220)}
  else if(snz){setTimeout(()=>fireNudge(style,'Snoozed reminder'),snz*(DEMO?1000:60000));snack(DEMO?`Snoozed — back in ${snz}s (demo)`:`Snoozed for ${snz} min`)}
}
setInterval(()=>{ // real schedule against local time
  const d=new Date(),hm=String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0'),key=d.toDateString()+hm;
  if(!rem.days[(d.getDay()+6)%7]||!rem.times.includes(hm)||nudgeLast===key)return;nudgeLast=key;
  // fire if nothing was logged since the last reminder, OR (at the day's last reminder) anything is still to sort:
  // a lone quick add no longer silences the evening "finish it" moment
  const since=lastRemAt,isLast=hm===[...rem.times].sort().pop();
  const still=()=>!lastLogAt||lastLogAt<since||(isLast&&toSort().length>0);
  fireNudge(rem.style,`Reminder · ${hm}`,still);lastRemAt=Date.now();
},15000);
setTimeout(()=>{if(rem.demo&&!nudgeOn)fireNudge(rem.style,'Demo',()=>!lastLogAt&&!nudgeOn)},20000);
document.addEventListener('keydown',e=>{
  if(!nudgeOn)return;
  if(e.key==='Escape'){e.stopImmediatePropagation();e.preventDefault();hideNudge();return}
  if(nudgeOn.id==='nudgeF'&&e.key==='Tab'){const f=[...nudgeOn.querySelectorAll('button')];const a=f[0],z=f[f.length-1];
    if(!nudgeOn.contains(document.activeElement)){e.preventDefault();a.focus()}
    else if(e.shiftKey&&document.activeElement===a){e.preventDefault();z.focus()}else if(!e.shiftKey&&document.activeElement===z){e.preventDefault();a.focus()}
    e.stopImmediatePropagation()}
},true);

/* ============ Snackbar & confetti ============ */
let snackT;
function snack(msg,undo){
  clearTimeout(snackT);$('#snackTx').textContent=msg;const b=$('#snackBtn');b.style.display=undo?'':'none';
  b.onclick=()=>{undo&&undo();$('#snack').classList.remove('on');buzz()};
  $('#snack').classList.add('on');snackT=setTimeout(()=>$('#snack').classList.remove('on'),undo?5000:2400);
}
function confetti(n=18){
  if(matchMedia('(prefers-reduced-motion:reduce)').matches)return;
  const cols=['var(--you)','var(--sam)','var(--sun)','var(--lilac)','var(--primary)'],shp=Object.keys(SH);
  const ease=Motion.stepped({closest:()=>true})?'steps(16,jump-end)':'cubic-bezier(.2,.7,.3,1)'; // celebrations count as .sm
  for(let i=0;i<n;i++){const d=document.createElement('div');d.className='confetti sm';
    d.style.cssText=`left:50%;top:60%;background:${cols[i%cols.length]};clip-path:${SH[shp[i%shp.length]]};width:${10+Math.random()*14}px;height:${10+Math.random()*14}px`;
    document.body.appendChild(d);const a=Math.random()*Math.PI*2,r=120+Math.random()*220;
    d.animate([{transform:'translate(-50%,-50%) scale(.2) rotate(0)',opacity:1},{transform:`translate(${Math.cos(a)*r}px,${Math.sin(a)*r-160}px) scale(1) rotate(${Math.random()*540}deg)`,opacity:1,offset:.6},{transform:`translate(${Math.cos(a)*r*1.1}px,${Math.sin(a)*r+120}px) scale(.8) rotate(${Math.random()*720}deg)`,opacity:0}],{duration:1300+Math.random()*500,easing:ease}).onfinish=()=>d.remove();}
}

/* ============ Global event delegation ============ */
let lpT=null,lpFired=false;
document.addEventListener('pointerdown',e=>{const n=e.target.closest('[data-lp]');if(!n||e.target.closest('[data-tog]'))return;lpFired=false;
  lpT=setTimeout(()=>{lpFired=true;openFolderMenu(n.dataset.lp)},480)});
['pointerup','pointercancel','pointerleave'].forEach(t=>document.addEventListener(t,()=>clearTimeout(lpT)));
document.addEventListener('contextmenu',e=>{const n=e.target.closest('[data-lp]');if(n){e.preventDefault();openFolderMenu(n.dataset.lp)}});
document.addEventListener('click',e=>{
  if(lpFired){lpFired=false;return}
  const t=e.target;let el;

(()=>{
  const M=$('#main');let s=null,swallow=false;
  const inner=()=>M.querySelector('.inner');
  const rubber=dx=>Math.sign(dx)*Math.pow(Math.abs(dx),.72)*(.7+.25*prefs.bounce);
  M.addEventListener('pointerdown',e=>{
    if(e.pointerType==='mouse'&&fine)return;if(sheetOpen()||e.button>0)return;
    const pi=PAGES.indexOf(route.v);if(pi<0||(route.d&&route.d.length))return;
    if(e.target.closest('.subs,.crumbs,.chips,.xs,input,[data-noswipe]'))return;
    s={x:e.clientX,y:e.clientY,t:performance.now(),id:e.pointerId,on:false,pi,dx:0};
  });
  M.addEventListener('pointermove',e=>{
    if(!s||e.pointerId!==s.id)return;const dx=e.clientX-s.x,dy=e.clientY-s.y;
    if(!s.on){if(Math.abs(dx)<12)return;if(Math.abs(dx)<Math.abs(dy)*1.3){s=null;return}
      s.on=true;clearTimeout(lpT);try{M.setPointerCapture(e.pointerId)}catch(x){}const i=inner();if(i)i.style.transition='none'}
    s.dx=dx;const edge=(dx>0&&s.pi===0)||(dx<0&&s.pi===PAGES.length-1);
    const i=inner();if(i)i.style.transform=`translateX(${edge?rubber(dx):dx*.9}px)`;
  });
  const end=e=>{
    if(!s||(e&&e.pointerId!==s.id))return;const w=s;s=null;if(!w.on)return;
    swallow=true;setTimeout(()=>swallow=false,60);
    const v=w.dx/Math.max(1,performance.now()-w.t),dir=w.dx<0?1:-1,to=w.pi+dir;
    const i=inner();
    if((Math.abs(w.dx)>70||Math.abs(v)>.45)&&to>=0&&to<PAGES.length){buzz(8);go({v:PAGES[to]},dir>0?'fwd':'back')}
    else if(i){i.style.transition=`transform calc(.55s + .2s * var(--bounce)) var(--spring)`;i.style.transform='';buzz(4)}
  };
  M.addEventListener('pointerup',end);M.addEventListener('pointercancel',e=>{if(s&&e.pointerId===s.id){const i=inner();if(i){i.style.transition='';i.style.transform=''}s=null}});
  document.addEventListener('click',e=>{if(swallow){e.stopPropagation();e.preventDefault();swallow=false}},true);
})();

function ensureFolders(){
  /* Deterministic ids (y2026, y2026m10): two fresh devices creating the same year converge on ONE folder via the server's merge, never duplicates.

  const y=TODAY.slice(0,4),id='y'+y,mk='halves.autoyear.'+y;

  folders.push({id,name:y,parent:null,icon:'calendar_month',shape:'cookie9',t:'coral'});

  if(r.status===401)return signedOut();if(!r.ok||!r.json)return;
  if(r.json.status==='pending')return adapter.onPendingDevice();
  auth={...auth,slot:r.json.slot||auth.slot,deviceId:r.json.deviceId||auth.deviceId,names:r.json.names||auth.names};ls.set(AUTH_K,auth);
  const before=P.sam.name+ME;setPeople(auth.names,auth.slot);if(P.sam.name+ME!==before&&!sheetOpen())render()}

/* T7a: a new device needs approval on a phone that's already in */
let approvals=[];
async function checkPending(){if(DEMO||!auth||gated)return;let r;try{r=await api('pending')}catch(e){return}
  if(r.status===401)return signedOut();if(!r.ok||!r.json)return;
  approvals=(r.json.devices||[]).filter(d=>d.status!=='active');refreshMe();showApprovals()}
function showApprovals(){
  if(!approvals.length||gated||sheetOpen()||draft)return;
  const d=approvals[0],dev=d.device||'New device',who=d.name||names[d.slot]||'Someone';let answered=false;
  openSheet(`<h3>Approve “${esc(dev)}” (${esc(who)})?</h3>
    <div class="ap-who"><span class="who ${d.slot===ME?'you':'sam'}" aria-hidden="true">${esc((who[0]||'?').toUpperCase())}</span><p class="muted" style="margin:0;font-size:14px">${esc(who)} opened an invite link on “${esc(dev)}” and is waiting. Allow it only if you know it’s them: an approved device sees everything.</p></div>
    <div class="actions"><button class="pill-btn" id="apNo">${icon('block')} Deny</button><button class="pill-btn filled" id="apYes">${icon('check')} Allow</button></div>`,
  b=>{const go=async allow=>{let r;try{r=await api('approve',{method:'POST',body:{deviceId:d.id,allow}})}catch(e){return snack('No connection. Try again.')}
      if(r.status===401)return signedOut();answered=true;approvals.shift();closeSheet();
      snack(r.ok?(allow?`“${dev}” is in`:'Request denied'):'That request is gone (already answered or expired)');if(allow)setTimeout(refreshMe,600)};
    b.querySelector('#apYes').onclick=()=>go(true);b.querySelector('#apNo').onclick=()=>go(false)},
  ()=>{if(!answered)approvals=[]}); // dismissed: ask again next time the app opens or the list changes
}

async function invite(){
  if(DEMO)return snack('Invites need the real app (this is demo mode)');
  let r;try{r=await api('invite',{method:'POST',body:{}})}catch(e){return snack(netMsg(e))}
  if(r.status===401)return signedOut();
  if(!r.ok||!r.json||!r.json.key)return snack(`Couldn’t create an invite (${(r.json&&r.json.error)||r.status})`);
  const url=joinLink(r.json.key),text='Join me on Halves, our shared expense log. On iPhone, open this link in Safari. It works once, within 24 hours.';
  if(navigator.share){try{await navigator.share({title:'Halves invite',text,url});snack('Invite sent · approve them here when they open it');return}catch(e){if(e&&e.name==='AbortError')return}}
  openSheet(`<h3>Invite link</h3><p class="muted" style="margin:-6px 4px 14px;font-size:14px">Send this over WhatsApp. It works once, for 24 hours, and the new device still needs your approval.</p>
    <label class="field"><span>Link</span><input type="text" id="ivLink" readonly value="${esc(url)}"></label>
    <button class="save" id="ivCopy">${icon('content_copy')}<span>Copy link</span></button>`,
  b=>{const i=b.querySelector('#ivLink');i.onfocus=()=>i.select();b.querySelector('#ivCopy').onclick=()=>copyText(text+' '+url,i).then(ok=>snack(ok?'Copied · paste it into WhatsApp':'Select the link and copy it'))});
}
async function openDevices(){
  if(DEMO)return snack('Devices need the real app (this is demo mode)');
  let r;try{r=await api('devices')}catch(e){return snack(netMsg(e))}
  if(r.status===401)return signedOut();if(!r.ok||!r.json)return snack('Couldn’t load devices. Try again.');
  const L=r.json.devices||[],when=t=>t?relTime(isoL(new Date(t))+'T'+new Date(t).toTimeString().slice(0,8)):'';
  openSheet(`<h3>Devices</h3><p class="muted" style="margin:-6px 4px 10px;font-size:14px">Up to 6. Revoking signs that device out at once and clears its copy.</p>
    <div>${L.map(d=>{const me=d.current||d.id===auth.deviceId,who=d.name||names[d.slot]||d.slot;
      return`<div class="dev-row"><span class="who ${d.slot===ME?'you':'sam'}" aria-hidden="true">${esc((who[0]||'?').toUpperCase())}</span>
      <div class="tx"><b>${esc(d.device||'Device')}</b><small>${esc(who)}${me?' · this device':''}${d.status==='pending'?' · waiting for approval':d.lastSeen?' · seen '+when(d.lastSeen):''}</small></div>
      ${d.status==='pending'?`<button class="pill-btn tonal" data-apv="${esc(d.id)}">Review</button>`:`<button class="pill-btn" data-rv="${esc(d.id)}" data-me="${me?1:''}">Revoke</button>`}</div>`}).join('')}</div>
    <button class="pill-btn tonal" id="dvInv" style="width:100%;justify-content:center;height:52px;margin-top:14px">${icon('person_add')} Invite partner / add a device</button>`,
  b=>{b.querySelector('#dvInv').onclick=()=>{closeSheet();setTimeout(invite,260)};
    b.querySelectorAll('[data-apv]').forEach(x=>x.onclick=()=>{closeSheet();setTimeout(checkPending,260)});
    b.querySelectorAll('[data-rv]').forEach(x=>x.onclick=async()=>{
      if(!x.dataset.armed){x.dataset.armed=1;x.textContent=x.dataset.me?'Sign out here?':'Tap to confirm';buzz(10);return}
      let r2;try{r2=await api('revoke',{method:'POST',body:{deviceId:x.dataset.rv}})}catch(e){return snack(netMsg(e))}
      if(r2.status===401)return signedOut();
      if(!r2.ok)return snack(r2.json&&r2.json.error==='last_device'?'That’s the last device: revoking it would lock you out.':'Couldn’t revoke. Try again.');
      if(r2.json&&r2.json.self)return signedOut();closeSheet();snack('Device revoked');setTimeout(openDevices,300)})});
}

/* ---- boot ---- */
if('serviceWorker' in navigator&&location.protocol!=='file:'&&!QS.has('nosw'))addEventListener('load',()=>navigator.serviceWorker.register(APPBASE+'sw.js',{scope:APPBASE}).catch(()=>{}));
(function boot(){
  const h=new URLSearchParams(location.hash.slice(1)),setup=h.get('setup'),key=h.get('k');
  if(setup||key){try{history.replaceState(history.state,'',location.pathname+location.search)}catch(e){}} // secrets leave the URL at once
  if(DEMO){auth={token:null,slot:'A',names:{A:'Demo',B:'Sam'},device:'This browser'};$('#demoBadge').hidden=false;return startApp()}
  auth=ls.get(AUTH_K);
  if(auth&&auth.token){if(key)setTimeout(()=>snack('This device is already in Halves'),600);return startApp()}
  if(setup)return setupScreen(setup);
  if(key)return joinFlow(key);
  if(ls.get(PEND_K))return pendingScreen();
  welcomeScreen();
})();

</script>
