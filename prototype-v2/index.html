<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FFF8F4">
<title>Halves prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto+Flex:opsz,wdth,wght@8..144,25..151,100..1000&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=block" rel="stylesheet">
<style>
/* ============ Tokens ============
   Skin contract (DESIGN.md §9.8): :root holds the shared defaults = the `modern` skin (V1 look).
   A skin overrides tokens with html[data-skin="<name>"]{…} (light) and
   html[data-skin="<name>"][data-theme="dark"] + @media(prefers-color-scheme:dark){html[data-skin="<name>"]:not([data-theme="light"])}
   (dark). Anything a skin leaves out falls back to modern. Motion tokens (--spring/--spring-soft/--ease) are generated in JS
   from --bounce and data-motion: skins should use them, not redefine them. */
:root,html[data-skin="modern"]{
  --font-ui:"Roboto Flex",system-ui,sans-serif; --font-display:var(--font-ui); --font-num:var(--font-ui);
  --good:#2E6B3F; --good-c:#D7EDD9; --warn:#8A5A00; --warn-c:#FFE7B3; --bad:#B3261E; --bad-c:#F9DEDC;
  --bg:#FFF8F4; --surface:#FFFFFF; --s1:#FBF1EC; --s2:#F5E6DF; --s3:#EDDAD1;
  --text:#231A16; --muted:#6E5D55; --outline:#DCC8BF;
  --primary:#A6431E; --on-primary:#FFFFFF; --primary-c:#FFDBCF; --on-primary-c:#3A0B00;
  --you:#E0602F; --you-c:#FFDBCF; --sam:#12807A; --sam-c:#B9EFE7; --you-t:#A33D14; --sam-t:#0A635D;
  --coral:#FFDBCF; --on-coral:#3A0B00; --teal:#B9EFE7; --on-teal:#00201D;
  --lilac:#E9DDFF; --on-lilac:#21005D; --sun:#FFE08A; --on-sun:#241A00;
  --sage:#D5E8C4; --on-sage:#0F2005; --sky:#D3E4FF; --on-sky:#001C38;
  --scrim:rgba(35,26,22,.38); --shadow:0 8px 28px rgba(80,40,20,.14);
  --r-xl:28px; --r-l:20px; --r-m:14px;
  color-scheme:light;
}
/* Motion tokens. *-fluid / *-step are overwritten by Motion.apply() for the current --bounce (fallbacks = V1 curves). */
:root{
  --bounce:1;
  --spring-fluid:linear(0,0.009,0.035 2.1%,0.141,0.281 6.7%,0.723 12.9%,0.938 16.7%,1.017,1.077,1.121,1.149 24.3%,1.159,1.163,1.161,1.154 29.9%,1.129 32.8%,1.051 39.6%,1.017 43.1%,0.991,0.977 51%,0.974 53.8%,0.975 57.1%,0.997 69.8%,1.003 76.9%,1);
  --spring-soft-fluid:cubic-bezier(.2,1.25,.4,1); --ease-fluid:cubic-bezier(.2,0,0,1);
  --spring-step:steps(7,jump-start); --spring-soft-step:steps(7,jump-start); --ease-step:steps(5,jump-start);
  --spring:var(--spring-fluid); --spring-soft:var(--spring-soft-fluid); --ease:var(--ease-fluid);
  /* V2r1: anything that carries tap targets (sheets, keypad) settles fast with NO overshoot, whatever --bounce says.
     Bounce stays on decoration + navigation. Stop-motion version is stepped but never jumps past rest. */
  --spring-sheet:cubic-bezier(.05,.7,.1,1); --sheet-dur:.2s;
}
/* stop = everything frame-by-frame (~12fps); hybrid = fluid UI, stepped only inside .sm (mascot, celebrations, empty states) */
html[data-motion="stop"],html[data-motion="hybrid"] .sm{--spring:var(--spring-step);--spring-soft:var(--spring-soft-step);--ease:var(--ease-step)}
html[data-motion="stop"]{--spring-sheet:steps(2,jump-start);--sheet-dur:.17s}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){
  --bg:#1A120F; --surface:#231915; --s1:#2B201C; --s2:#352925; --s3:#41332E;
  --text:#F3E2DA; --muted:#C4AEA5; --outline:#57463F;
  --primary:#FFB59C; --on-primary:#5C1A00; --primary-c:#80300F; --on-primary-c:#FFDBCF;
  --you:#FF8F62; --you-c:#6E2A12; --sam:#5ED8CA; --sam-c:#00504A; --you-t:#FFAA85; --sam-t:#7FE6D9;
  --coral:#6E2A12; --on-coral:#FFDBCF; --teal:#00504A; --on-teal:#B9EFE7;
  --lilac:#4A3A78; --on-lilac:#E9DDFF; --sun:#5A4500; --on-sun:#FFE08A;
  --sage:#2F4A1E; --on-sage:#D5E8C4; --sky:#1E3F66; --on-sky:#D3E4FF;
  --good:#8FD6A0; --good-c:#1F3B27; --warn:#F2C46B; --warn-c:#4A3500; --bad:#F2B8B5; --bad-c:#5C1D18;
  --scrim:rgba(0,0,0,.55); --shadow:0 8px 28px rgba(0,0,0,.4); color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#1A120F; --surface:#231915; --s1:#2B201C; --s2:#352925; --s3:#41332E;
  --text:#F3E2DA; --muted:#C4AEA5; --outline:#57463F;
  --primary:#FFB59C; --on-primary:#5C1A00; --primary-c:#80300F; --on-primary-c:#FFDBCF;
  --you:#FF8F62; --you-c:#6E2A12; --sam:#5ED8CA; --sam-c:#00504A; --you-t:#FFAA85; --sam-t:#7FE6D9;
  --coral:#6E2A12; --on-coral:#FFDBCF; --teal:#00504A; --on-teal:#B9EFE7;
  --lilac:#4A3A78; --on-lilac:#E9DDFF; --sun:#5A4500; --on-sun:#FFE08A;
  --sage:#2F4A1E; --on-sage:#D5E8C4; --sky:#1E3F66; --on-sky:#D3E4FF;
  --good:#8FD6A0; --good-c:#1F3B27; --warn:#F2C46B; --warn-c:#4A3500; --bad:#F2B8B5; --bad-c:#5C1D18;
  --scrim:rgba(0,0,0,.55); --shadow:0 8px 28px rgba(0,0,0,.4); color-scheme:dark;
}
.t-coral{--c:var(--coral);--on:var(--on-coral)} .t-teal{--c:var(--teal);--on:var(--on-teal)}
.t-lilac{--c:var(--lilac);--on:var(--on-lilac)} .t-sun{--c:var(--sun);--on:var(--on-sun)}
.t-sage{--c:var(--sage);--on:var(--on-sage)} .t-sky{--c:var(--sky);--on:var(--on-sky)}

/* ============ Base ============ */
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--text);font-family:var(--font-ui);
  font-variation-settings:"opsz" 16;font-size:16px;line-height:1.4;overscroll-behavior:none}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
input{font:inherit;color:inherit}
.ms{font-family:"Material Symbols Rounded";font-weight:normal;font-style:normal;font-size:24px;line-height:1;
  display:inline-block;white-space:nowrap;direction:ltr;-webkit-font-smoothing:antialiased;
  font-variation-settings:"FILL" 0,"wght" 450,"GRAD" 0,"opsz" 24;transition:font-variation-settings .3s var(--ease)}
.ms.fill{font-variation-settings:"FILL" 1,"wght" 500,"GRAD" 0,"opsz" 24}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.shape{clip-path:var(--s,var(--sh-circle));transition:clip-path .6s var(--spring),transform .5s var(--spring)}

/* ============ App shell ============ */
.app{display:grid;grid-template-rows:auto 1fr;height:100dvh;max-width:560px;margin:0 auto;position:relative}
.topbar{display:flex;align-items:center;gap:8px;padding:calc(env(safe-area-inset-top) + 10px) 16px 6px}
.topbar .brand{font-weight:800;font-variation-settings:"wdth" 120,"opsz" 32;font-size:20px;letter-spacing:-.01em;display:flex;align-items:center;gap:8px}
.topbar .brand i{width:22px;height:22px;background:linear-gradient(90deg,var(--you) 50%,var(--sam) 50%);display:inline-block}
.topbar .sp{flex:1}
.icon-btn{width:44px;height:44px;border-radius:22px;display:grid;place-items:center;transition:background .2s,border-radius .4s var(--spring)}
.icon-btn:hover{background:var(--s2)} .icon-btn:active{border-radius:12px;background:var(--s3)}
main{overflow-y:auto;overflow-x:hidden;padding:4px 16px calc(120px + env(safe-area-inset-bottom));view-transition-name:main;scrollbar-width:thin;touch-action:pan-y pinch-zoom}
.rail,.treepane{display:none}

/* bottom floating toolbar + FAB (thumb zone) */
.dock{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom));width:min(528px,calc(100% - 32px));
  display:flex;align-items:center;gap:12px;z-index:20;view-transition-name:dock;pointer-events:none}
.toolbar{pointer-events:auto;flex:1;display:flex;justify-content:space-around;background:var(--s2);border-radius:999px;padding:8px;box-shadow:var(--shadow)}
.tb{display:flex;align-items:center;gap:6px;height:48px;padding:0 14px;border-radius:24px;color:var(--muted);transition:background .35s var(--ease),color .2s,padding .45s var(--spring)}
.tb .lbl{font-weight:600;font-size:14px;max-width:0;overflow:hidden;opacity:0;transition:max-width .45s var(--spring),opacity .2s}
.tb[aria-current="true"]{background:var(--primary-c);color:var(--on-primary-c);padding:0 18px}
.tb[aria-current="true"] .lbl{max-width:90px;opacity:1}
.tb[aria-current="true"] .ms{font-variation-settings:"FILL" 1,"wght" 600,"GRAD" 0,"opsz" 24}
.fab{pointer-events:auto;width:64px;height:64px;background:var(--primary);color:var(--on-primary);display:grid;place-items:center;
  --s:var(--sh-squircle);box-shadow:var(--shadow);filter:drop-shadow(0 6px 14px rgba(160,60,20,.3))}
.fab .ms{font-size:30px;transition:transform .5s var(--spring)}
.fab:hover{--s:var(--sh-cookie6)} .fab:hover .ms{transform:rotate(90deg)}
.fab:active{transform:scale(.9);--s:var(--sh-cookie9)}

/* ============ Shared components ============ */
h2.sec{font-size:13px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:28px 4px 10px;display:flex;align-items:center;gap:8px}
h2.sec .sp{flex:1}
.pill-btn{height:40px;padding:0 16px;border-radius:20px;background:var(--s2);font-weight:600;font-size:14px;display:inline-flex;align-items:center;gap:6px;transition:border-radius .4s var(--spring),background .2s,transform .4s var(--spring)}
.pill-btn:active{border-radius:10px;transform:scale(.96)}
.pill-btn.tonal{background:var(--primary-c);color:var(--on-primary-c)}
.pill-btn.filled{background:var(--primary);color:var(--on-primary)}
.pill-btn .ms{font-size:20px}
.text-btn{font-size:14px;font-weight:600;color:var(--primary);min-height:44px;padding:8px 12px;border-radius:16px;text-transform:none;letter-spacing:0}
.text-btn:hover{background:var(--s2)}

/* hero balance */
.hero{position:relative;overflow:hidden;border-radius:var(--r-xl);padding:22px 22px 18px;margin-top:6px;
  background:var(--hero-bg,var(--primary-c));color:var(--hero-on,var(--on-primary-c));isolation:isolate}
.hero.owe{--hero-bg:var(--sam-c);--hero-on:var(--text)}
.hero.even{--hero-bg:var(--s2);--hero-on:var(--text)}
.hero .blob{position:absolute;right:-50px;top:-40px;width:210px;height:210px;background:var(--hero-on);opacity:.07;z-index:-1;
  --s:var(--sh-cookie9);transition:transform 1.2s var(--spring)}
.hero:hover .blob,.hero:active .blob{transform:rotate(60deg)}
.hero .lbl{font-size:15px;font-weight:600;opacity:.85;display:flex;align-items:center;gap:6px}
.hero .amt{font-size:clamp(48px,15vw,68px);line-height:1.05;margin:6px 0 14px;letter-spacing:-.02em;
  font-variation-settings:"wght" var(--w,800),"wdth" var(--wd,100),"opsz" 144;transition:font-variation-settings .6s var(--spring);cursor:pointer;user-select:none}
.hero .amt:active{--wd:70}
.hero .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.hero .row .pill-btn{background:color-mix(in srgb,var(--hero-on) 12%,transparent)}
.hero .row .pill-btn.filled{background:var(--hero-on);color:var(--hero-bg)}
.hero .ctx{font-size:13px;opacity:.75;margin-left:auto}

/* tree */
.tree{background:var(--surface);border-radius:var(--r-l);padding:6px;border:1px solid var(--s2)}
.node{display:flex;align-items:center;gap:12px;padding:8px 8px 8px calc(8px + var(--depth,0) * 22px);border-radius:16px;position:relative;cursor:pointer;
  transition:background .2s,transform .45s var(--spring);user-select:none}
.node:hover{background:var(--s1)} .node:active{transform:scale(.98)}
.node.child::before{content:"";position:absolute;left:calc(var(--depth) * 22px - 2px);top:-4px;bottom:50%;width:12px;border-left:2px solid var(--outline);border-bottom:2px solid var(--outline);border-bottom-left-radius:10px}
.node .ic{width:42px;height:42px;display:grid;place-items:center;background:var(--c);color:var(--on);flex:none}
.node .ic .ms{font-size:22px}
.node:hover .ic{--s:var(--s-hover,var(--sh-cookie9));transform:rotate(-8deg)}
.node .nm{flex:1;min-width:0}
.node .nm b{display:block;font-weight:650;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.node .nm small{color:var(--muted);font-size:13px}
.node .net{font-size:13px;font-weight:650;text-align:right}
.node .chev{width:44px;height:44px;border-radius:22px;display:grid;place-items:center;color:var(--muted);transition:transform .45s var(--spring),background .2s}
.node .chev:hover{background:var(--s2)}
.node.open .chev{transform:rotate(90deg)}
.node.active{background:var(--primary-c);color:var(--on-primary-c)}
.kids{display:grid;grid-template-rows:0fr;transition:grid-template-rows .45s var(--spring)}
.kids>div{overflow:hidden}
.kids.open{grid-template-rows:1fr}

/* expense rows */
.day{font-size:13px;font-weight:650;color:var(--muted);margin:18px 6px 6px}
.list{display:flex;flex-direction:column;gap:2px}
.row-x{display:flex;align-items:center;gap:12px;padding:10px 10px;border-radius:18px;background:var(--surface);cursor:pointer;
  transition:transform .45s var(--spring),background .2s,border-radius .4s var(--spring)}
.list .row-x:first-child{border-top-left-radius:22px;border-top-right-radius:22px}
.list .row-x:last-child{border-bottom-left-radius:22px;border-bottom-right-radius:22px}
.list .row-x:not(:first-child):not(:last-child){border-radius:6px}
.list .row-x:only-child{border-radius:22px}
.row-x:hover{background:var(--s1)} .row-x:active{transform:scale(.98)}
.row-x .ic{width:44px;height:44px;display:grid;place-items:center;background:var(--c);color:var(--on);flex:none;--s:var(--sh-squircle)}
.row-x:hover .ic{--s:var(--sh-cookie6)}
.row-x .tx{flex:1;min-width:0}
.row-x .tx b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row-x .tx small{color:var(--muted);font-size:13px;display:flex;gap:6px;align-items:center}
.row-x .am{text-align:right;flex:none}
.row-x .am b{display:block;font-weight:650}
.row-x .am small{font-size:12px;font-weight:600}
.pos{color:var(--you-t)} .neg{color:var(--sam-t)}
:focus-visible{outline:3px solid var(--primary);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.dot{width:8px;height:8px;border-radius:4px;display:inline-block;flex:none}
.row-x.new{animation:pop .7s var(--spring)}
@keyframes pop{from{transform:scale(.6) translateY(20px);opacity:0}}
.row-x.settle .ic{--c:var(--s2);--on:var(--text)}

/* folder view */
.crumbs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;margin:4px -16px 0;padding:0 16px}
.crumb{height:40px;padding:0 14px;border-radius:20px;background:var(--s1);font-size:13px;font-weight:600;white-space:nowrap;display:flex;align-items:center;gap:4px;flex:none}
.crumb:last-child{background:none;color:var(--muted)}
.crumb-sep{color:var(--outline);display:flex;align-items:center}
.fhead{display:flex;align-items:flex-start;gap:14px;margin:18px 0 6px}
.fhead .ic{width:64px;height:64px;display:grid;place-items:center;background:var(--c);color:var(--on);flex:none;--s:var(--sh-cookie9)}
.fhead .ic:hover{transform:rotate(14deg);--s:var(--sh-flower)}
.fhead .ic .ms{font-size:32px}
.fhead h1{margin:0;font-size:34px;line-height:1.1;font-variation-settings:"wght" 760,"wdth" 112,"opsz" 60;letter-spacing:-.015em}
.fhead .meta{font-size:14px;color:var(--muted);margin-top:4px}
.fnet{margin:16px 2px 4px}.fnet small{display:block;font-size:13px;font-weight:650;color:var(--muted)}.fnet b{font-size:32px;font-variation-settings:"wght" 760,"opsz" 60}.fnet span{font-size:13px;color:var(--muted)}
.fstats{display:flex;gap:8px;margin:14px 0 4px;flex-wrap:wrap}
.stat{flex:1;min-width:120px;background:var(--surface);border-radius:var(--r-l);padding:12px 14px;border:1px solid var(--s2)}
.stat small{display:block;font-size:12px;color:var(--muted);font-weight:600}
.stat b{font-size:22px;font-variation-settings:"wght" 700,"opsz" 40}
.subs{display:flex;gap:10px;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:2px 16px 4px}
.subtile{flex:none;width:128px;background:var(--surface);border-radius:var(--r-l);padding:12px;text-align:left;border:1px solid var(--s2);transition:transform .45s var(--spring),border-radius .4s var(--spring)}
.subtile:hover{border-radius:28px} .subtile:active{transform:scale(.95)}
.subtile .ic{width:40px;height:40px;display:grid;place-items:center;background:var(--c);color:var(--on);margin-bottom:10px}
.subtile b{display:block;font-size:15px;font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.subtile small{font-size:12px;color:var(--muted)}
.subtile.add{border-style:dashed;border-color:var(--outline);display:flex;flex-direction:column;justify-content:center;align-items:center;gap:6px;color:var(--muted);background:none}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:14px -16px 0;padding:0 16px}
.chip{height:40px;padding:0 14px;border-radius:12px;border:1px solid var(--outline);font-size:13px;font-weight:600;display:inline-flex;align-items:center;gap:6px;flex:none;
  transition:border-radius .4s var(--spring),background .2s,border-color .2s}
.chip .ms{font-size:18px}
.chip[aria-pressed="true"]{background:var(--primary-c);color:var(--on-primary-c);border-color:transparent;border-radius:20px}
.empty{text-align:center;padding:40px 20px;color:var(--muted)}
.empty .shape{width:96px;height:96px;margin:0 auto 14px;background:var(--s2);display:grid;place-items:center;--s:var(--sh-flower)}

/* insights */
.bars{display:flex;flex-direction:column;gap:10px;background:var(--surface);padding:16px;border-radius:var(--r-l);border:1px solid var(--s2)}
.bar{display:grid;grid-template-columns:28px 1fr auto;gap:10px;align-items:center;font-size:14px}
.bar .track{height:14px;border-radius:7px;background:var(--s1);overflow:hidden}
.bar .fill{height:100%;border-radius:7px;background:var(--c);width:0;transition:width 1s var(--spring)}
.split-bar{display:flex;height:48px;border-radius:24px;overflow:hidden;gap:4px;margin:8px 0}
.split-bar div{display:flex;align-items:center;padding:0 14px;font-weight:700;font-size:14px;border-radius:8px}
.split-bar div:first-child{background:var(--you-c);color:var(--text);box-shadow:inset 4px 0 0 var(--you);border-radius:24px 8px 8px 24px}
.split-bar div:last-child{background:var(--sam-c);color:var(--text);box-shadow:inset -4px 0 0 var(--sam);border-radius:8px 24px 24px 8px;justify-content:flex-end}

/* ============ Sheet ============ */
.scrim{position:fixed;inset:0;background:var(--scrim);opacity:0;pointer-events:none;transition:opacity .3s;z-index:40}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:50%;bottom:0;width:min(560px,100%);max-height:94dvh;background:var(--surface);z-index:41;
  border-radius:var(--r-xl) var(--r-xl) 0 0;transform:translate(-50%,105%);transition:transform var(--sheet-dur) var(--spring-sheet);
  display:flex;flex-direction:column;padding-bottom:env(safe-area-inset-bottom);box-shadow:var(--shadow)}
.sheet.on{transform:translate(-50%,0)}
.sheet.dragging{transition:none}
.grab{padding:10px 0 4px;display:grid;place-items:center;cursor:grab;touch-action:none}
.grab i{width:36px;height:5px;border-radius:3px;background:var(--outline)}
.sheet-body{overflow-y:auto;padding:0 16px 16px}
.sheet h3{margin:4px 4px 14px;font-size:22px;font-variation-settings:"wght" 700,"wdth" 110,"opsz" 32}

/* add expense */
.ae-top{display:flex;align-items:center;gap:8px;margin:2px 0 4px}
.ae-top input{flex:1;border:0;background:var(--s1);border-radius:16px;height:48px;padding:0 16px;font-size:16px;transition:border-radius .4s var(--spring),background .2s}
.ae-top input:focus{border-radius:24px;background:var(--s2)}

/* ============ V2 ============ */
.ptitle,.fhead h1,.sheet h3,.hero .amt,.det-hero .v,.today .big{font-family:var(--font-display)}
/* skin hooks: ornament slots + mascot are inert decoration; the modern skin hides them */
.ornament,.mascot{pointer-events:none}
.mascot{width:var(--mascot-size,64px);height:var(--mascot-size,64px);flex:none}
.hero .mascot,.today .mascot{position:absolute;right:14px;top:14px}

/* sheet overshoot: keep paper under the sheet when the spring lifts it */
.sheet::after{content:"";position:absolute;left:0;right:0;top:calc(100% - 2px);height:120px;background:var(--surface)}

.in{animation:rowIn calc(.5s + .12s * var(--bounce)) var(--spring) backwards;animation-delay:calc(var(--i,0) * 28ms)}
@keyframes rowIn{from{opacity:0;transform:translateY(calc(10px + 14px * var(--bounce))) scale(.95)}}

/* page dots (Trends is page 3, reached by swipe / dots / dial) */

.pdot{width:20px;height:44px;display:grid;place-items:center;border-radius:10px}

  transition:border-radius .4s var(--spring),background .2s,flex .45s var(--spring),color .2s}
.seg button:first-child{border-radius:22px 10px 10px 22px}.seg button:last-child{border-radius:10px 22px 22px 10px}
.seg button[aria-checked="true"]{background:var(--primary-c);color:var(--on-primary-c);border-radius:22px;flex:1.3}

.days{display:flex;gap:4px;justify-content:space-between}
.days button{width:40px;height:40px;border-radius:20px;background:var(--s1);font-weight:700;font-size:13px;transition:border-radius .35s var(--spring),background .2s}
.days button[aria-pressed="true"]{background:var(--primary-c);color:var(--on-primary-c);border-radius:12px}
/* tags */
.tagrow{display:flex;gap:4px;margin-top:4px;overflow:hidden}
.tagc{font-size:11px;font-weight:650;padding:2px 8px;border-radius:8px;background:var(--s2);color:var(--muted);white-space:nowrap;flex:none}

.tagnew{display:flex;gap:8px;margin-top:12px}.tagnew input{flex:1;min-width:0;height:44px;border:0;border-radius:14px;background:var(--s1);padding:0 14px;font-size:15px}

<script>
/* ============ Shapes (M3-expressive-ish polygon library, equal vertex count → morphable) ============ */
const PTS = 96;
function polar(fn){const a=[];for(let i=0;i<PTS;i++){const t=i/PTS*Math.PI*2-Math.PI/2;const r=fn(t);a.push(`${(50+r*Math.cos(t)).toFixed(2)}% ${(50+r*Math.sin(t)).toFixed(2)}%`)}return `polygon(${a.join(',')})`}
const cookie=(n,amp)=>polar(t=>50*(1-amp)+50*amp*Math.cos(n*t));
const squircle=p=>polar(t=>50*Math.pow(Math.pow(Math.abs(Math.cos(t)),p)+Math.pow(Math.abs(Math.sin(t)),p),-1/p)*.98);
const SH={circle:polar(()=>50),squircle:squircle(4),cookie4:cookie(4,.1),cookie6:cookie(6,.08),cookie9:cookie(9,.06),clover:cookie(4,.2),flower:cookie(5,.14),sunny:cookie(12,.04)};
for(const k in SH)document.documentElement.style.setProperty('--sh-'+k,SH[k]);

/* ============ Mock data ============ */
const TODAY='2026-11-06';
const P={you:{name:'You',init:'A',color:'var(--you)'},sam:{name:'Sam',init:'S',color:'var(--sam)'}};
const CATS={
  groc:{name:'Groceries',icon:'shopping_basket',t:'sage'}, rent:{name:'Rent',icon:'home',t:'sky'},
  food:{name:'Eating out',icon:'ramen_dining',t:'coral'}, travel:{name:'Travel',icon:'flight',t:'teal'},
  bills:{name:'Bills',icon:'bolt',t:'sun'}, fun:{name:'Fun',icon:'local_activity',t:'lilac'},
  shop:{name:'Shopping',icon:'shopping_bag',t:'coral'}, other:{name:'Other',icon:'category',t:'sage'}};
let folders=[
  {id:'y26',name:'2026',parent:null,icon:'calendar_month',shape:'cookie9',t:'coral'},
  {id:'sep',name:'September',parent:'y26',icon:'eco',shape:'clover',t:'sage'},
  {id:'oct',name:'October',parent:'y26',icon:'nights_stay',shape:'cookie6',t:'lilac'},
  {id:'nov',name:'November',parent:'y26',icon:'local_fire_department',shape:'sunny',t:'sun'},
  {id:'goa',name:'Goa trip',parent:null,icon:'beach_access',shape:'flower',t:'teal'},
  {id:'home',name:'Home setup',parent:null,icon:'chair',shape:'clover',t:'sky',split:60},
  {id:'kit',name:'Kitchen',parent:'home',icon:'skillet',shape:'cookie4',t:'coral'},
];
let uid=100;
/* V2r1: every expense records who logged it and when (by / at), separate from who paid. Seed mixes both people;
   two of Sam's entries are newer than your seeded "last looked" time, so Home shows "New from Sam". review = needs details
   (set automatically when saved without a title, or via "Finish later"); independent of sp:'later' (split undecided). */
let expenses=[
  {id:1,folder:'nov',sp:'one',title:'Big Basket weekly',amt:284000,paid:'you',share:50,cat:'groc',date:'2026-11-05',tags:['home'],by:'sam',at:'2026-11-05T21:40'},
  {id:2,folder:'nov',sp:'split',title:'Electricity',amt:196000,paid:'sam',share:50,cat:'bills',date:'2026-11-05',tags:['home'],by:'sam',at:'2026-11-06T08:40'},
  {id:3,folder:'nov',sp:'one',title:'Dinner at Toit',amt:342000,paid:'you',share:50,cat:'food',date:'2026-11-04',tags:['weekend'],by:'you',at:'2026-11-04T23:10'},
  {id:4,folder:'nov',sp:'split',title:'November rent',amt:3800000,paid:'sam',share:50,cat:'rent',date:'2026-11-01',tags:['home'],by:'you',at:'2026-11-01T10:05'},
  {id:5,folder:'nov',sp:'one',title:'Movie tickets',amt:84000,paid:'sam',share:50,cat:'fun',date:'2026-11-02',tags:['weekend'],by:'sam',at:'2026-11-02T18:20'},
  {id:15,folder:'nov',sp:'later',title:'Swiggy late night',amt:64000,paid:'you',share:50,cat:'food',date:'2026-11-03',tags:['swiggy','impulse'],by:'you',at:'2026-11-03T01:15'},
  {id:17,folder:'nov',sp:'one',title:'',amt:45000,paid:'sam',share:50,cat:null,date:'2026-11-04',tags:[],by:'sam',at:'2026-11-04T13:02',review:true},
  {id:6,folder:'oct',sp:'split',title:'October rent',amt:3800000,paid:'you',share:50,cat:'rent',date:'2026-10-01',tags:['home'],by:'you',at:'2026-10-01T09:30'},
  {id:7,folder:'oct',sp:'one',title:'Diwali sweets',amt:156000,paid:'you',share:50,cat:'food',date:'2026-10-20',tags:['gift'],by:'you',at:'2026-10-20T19:45'},
  {id:8,folder:'oct',sp:'one',title:'Zepto run',amt:92000,paid:'sam',share:50,cat:'groc',date:'2026-10-14',tags:[],by:'sam',at:'2026-10-14T20:12'},
  {id:9,folder:'sep',sp:'split',title:'September rent',amt:3800000,paid:'sam',share:50,cat:'rent',date:'2026-09-01',tags:['home'],by:'sam',at:'2026-09-01T09:00'},
  {id:10,folder:'goa',sp:'one',title:'Flights BLR–GOI',amt:1240000,paid:'you',share:50,cat:'travel',date:'2026-10-28',tags:[],by:'you',at:'2026-10-12T22:30'},
  {id:11,folder:'goa',sp:'later',title:'Villa (3 nights)',amt:1860000,paid:'sam',share:50,cat:'travel',date:'2026-10-29',tags:['weekend'],by:'sam',at:'2026-10-29T15:40'},
  {id:12,folder:'goa',sp:'one',title:'Scooter rental',amt:120000,paid:'you',share:50,cat:'travel',date:'2026-10-30',tags:['weekend'],by:'you',at:'2026-10-30T11:00'},
  {id:16,folder:'goa',sp:'one',title:'Client dinner (expensed)',amt:210000,paid:'you',share:50,cat:'food',date:'2026-10-30',tags:['work-trip'],by:'you',at:'2026-10-31T09:15'},
  {id:13,folder:'kit',sp:'split',title:'Air fryer',amt:699000,paid:'you',share:60,cat:'shop',date:'2026-09-18',tags:['impulse','home'],by:'you',at:'2026-09-18T17:00'},
  {id:14,folder:'home',sp:'split',title:'Curtains',amt:420000,paid:'sam',share:60,cat:'shop',date:'2026-09-12',tags:['home'],by:'you',at:'2026-09-13T10:20'},
];
/* fake clock: the prototype lives on TODAY at 18:30, advancing with real elapsed time (so "just now" / "2h ago" read right) */
const BOOT=Date.now(),CLOCK0=new Date(2026,10,6,18,30).getTime();
const nowISO=()=>{const d=new Date(CLOCK0+(Date.now()-BOOT));return isoL(d)+'T'+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')};
const relTime=at=>{if(!at)return'';const m=Math.round((new Date(nowISO())-new Date(at))/6e4);if(m<1)return'just now';if(m<60)return m+'m ago';if(m<20*60)return Math.round(m/60)+'h ago';return dayLbl(at.slice(0,10))};
let lastSeen='2026-11-05T21:00'; // when "you" last looked (seeded; in-memory so every reload demos the partner view)
let settles=[{id:50,from:'you',to:'sam',amt:2200000,date:'2026-10-05',folder:null,method:'UPI'}];
/* V2: tags (labels; multi-select) and targets/limits. Simple mode shows only overall + folder targets (§9.2a). */
let TAGS=['weekend','swiggy','gift','work-trip','impulse','home'];
let targets=[
  {id:'t1',kind:'overall',ref:null,period:'month',amt:6000000},
  {id:'t2',kind:'folder',ref:'goa',period:'lifetime',amt:4000000},
  {id:'t3',kind:'category',ref:'food',period:'month',amt:600000},
  {id:'t4',kind:'tag',ref:'weekend',period:'month',amt:400000},
];

/* ============ Helpers ============ */
const $=s=>document.querySelector(s);
const inr=new Intl.NumberFormat('en-IN',{maximumFractionDigits:2});
const money=p=>'₹'+inr.format(Math.round(p)/100);
const money0=p=>'₹'+inr.format(Math.round(p/100));
const F=id=>folders.find(f=>f.id===id);
const kids=id=>folders.filter(f=>f.parent===id);
const desc=id=>[id,...kids(id).flatMap(k=>desc(k.id))];
const path=id=>{const a=[];let f=F(id);while(f){a.unshift(f);f=F(f.parent)}return a};
// + means Sam owes you
// V2 §9.2b: one-sided = no debt; 'later' (to sort) = excluded until sorted; legacy rows without sp = split
const spOf=e=>e.sp||'split';
const owedBy=e=>spOf(e)!=='split'?0:e.paid==='you'?e.amt*(100-e.share)/100:-e.amt*e.share/100;
/* V2r1 "to sort" = needs review (no details / "Finish later") OR split undecided. The review half never depends on the split layer. */
const isLater=e=>prefs.split==='on'&&spOf(e)==='later';
const isPend=e=>!!e.review||isLater(e);
const toSort=()=>expenses.filter(isPend).sort((a,b)=>(a.at||a.date).localeCompare(b.at||b.date)); // oldest first = queue order
const hasDefSplit=id=>{let f=F(id);while(f){if(f.split!=null)return true;f=F(f.parent)}return false};
const SP_LBL={one:'One-sided',split:'Split',later:'Decide later'};
const sortPill=()=>{const n=toSort().length;return n?`<button class="sortq" data-act="sortq" aria-label="${n} to sort, open the queue">${n} to sort${icon('chevron_right')}</button>`:''};
const UNCAT={name:'Uncategorised',icon:'help',t:'none'};
const catOf=e=>CATS[e&&e.cat]||UNCAT;
const ttl=e=>e.title||'Untitled';
function balance(ids){
  const set=ids?new Set(ids):null;
  let b=0;for(const e of expenses)if(!set||set.has(e.folder))b+=owedBy(e);
  if(!set)for(const s of settles)b+=s.from==='sam'?-s.amt:s.amt;
  return b}
const spend=ids=>{const s=new Set(ids);return expenses.filter(e=>s.has(e.folder)).reduce((a,e)=>a+e.amt,0)};
const dayLbl=d=>{if(d===TODAY)return'Today';const t=new Date(TODAY),x=new Date(d);const diff=(t-x)/864e5;if(diff===1)return'Yesterday';
  return x.toLocaleDateString('en-IN',{weekday:'short',day:'numeric',month:'short'})};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const buzz=(ms=8)=>{try{navigator.vibrate&&navigator.vibrate(ms)}catch(e){}};
const netTxt=b=>Math.round(b)===0?'all square':b>0?`${P.sam.name} owes you ${money0(b)}`:`you owe ${P.sam.name} ${money0(-b)}`;
const splitTxt=sh=>`You ${sh} · ${P.sam.name} ${100-sh}`;
const isoL=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const parseL=s=>{const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const icon=(n,fill)=>`<span class="ms${fill?' fill':''}" aria-hidden="true">${n}</span>`;

/* ============ V2: Motion system ============
   --bounce (0–2) → damping of a spring; we sample it into CSS linear() curves.
   *-fluid = smooth curve, *-step = the same spring held per frame at ~12fps (stop-motion keeps its overshoot).
   data-motion picks which one --spring/--spring-soft/--ease resolve to (see CSS). Motion.boil(el) / .boil = line boil. */
const RM=()=>matchMedia('(prefers-reduced-motion:reduce)').matches;
const Motion=(()=>{
  const R=document.documentElement;let frame=0,timer=null;const subs=[];
  const springX=z=>{const w=5/z,wd=w*Math.sqrt(1-z*z);return t=>1-Math.exp(-z*w*t)*(Math.cos(wd*t)+z*w/wd*Math.sin(wd*t))};
  const smooth=z=>{const x=springX(z),n=72,a=[];for(let i=0;i<n;i++)a.push(i===0?'0':i===n-1?'1':x(i/(n-1)).toFixed(3));return`linear(${a.join(',')})`};
  // first held frame is clamped to ≤ rest, so stop-motion never "teleports" past where things land (later frames may overshoot)
  const stepped=(z,F=7)=>{const x=springX(z),a=[];for(let k=0;k<F;k++){const v=k===F-1?1:k===0?Math.min(1,x(1/F)):x((k+1)/F);a.push(`${v.toFixed(3)} ${(k/F*100).toFixed(2)}%`,`${v.toFixed(3)} ${((k+1)/F*100).toFixed(2)}%`)}return`linear(${a.join(',')})`};
  function apply(){
    const b=RM()?0:prefs.bounce;
    const z=b>0.01?0.9*Math.exp(-0.81*b):0, zs=b>0.01?Math.min(.95,z*1.45):0;
    const set=(k,v)=>R.style.setProperty(k,v);
    set('--bounce',b);
    set('--spring-fluid',z?smooth(z):'cubic-bezier(.2,0,0,1)');
    set('--spring-soft-fluid',zs?smooth(zs):'cubic-bezier(.2,0,0,1)');
    set('--spring-step',stepped(z||.97));set('--spring-soft-step',stepped(zs||.97));set('--ease-step','steps(5,jump-start)');
    sync();
  }
  function tick(){
    if(document.hidden)return;frame=(frame+1)%3;
    const m=R.dataset.motion,els=[...document.querySelectorAll('.boil')].filter(e=>m==='stop'||e.closest('.sm'));
    els.forEach(e=>{e.style.setProperty('--boil',frame);e.style.setProperty('--boil-j',[0,1,-1][frame])});
    if(els.length)document.querySelectorAll('#ink-wobble feTurbulence,#grain feTurbulence').forEach((t,i)=>t.setAttribute('seed',frame+1+i*7));
    subs.forEach(f=>{try{f(frame)}catch(e){}});
  }
  function sync(){const on=R.dataset.motion!=='fluid'&&!RM();
    if(on&&!timer)timer=setInterval(tick,83);
    else if(!on&&timer){clearInterval(timer);timer=null;document.querySelectorAll('.boil').forEach(e=>{e.style.removeProperty('--boil');e.style.removeProperty('--boil-j')})}}
  matchMedia('(prefers-reduced-motion:reduce)').addEventListener?.('change',apply);
  return{apply,sync,
    boil(el){el.classList.add('boil');sync();return()=>el.classList.remove('boil')}, // returns an "unboil" fn
    onFrame(f){subs.push(f)},                       // f(frameIndex) every 83ms while stop/hybrid is on
    get frame(){return frame},
    stepped:el=>R.dataset.motion==='stop'||(R.dataset.motion==='hybrid'&&!!(el&&el.closest&&el.closest('.sm'))),
    easing(el){return this.stepped(el)?'steps(16,jump-end)':'cubic-bezier(.2,.7,.3,1)'}};
})();
Motion.apply();
const emit=(n,d)=>document.dispatchEvent(new CustomEvent('halves:'+n,{detail:d}));

/* ============ V2: modes, tags, targets ============ */
const detailed=()=>prefs.mode==='detailed';
const normTag=s=>String(s||'').trim().toLowerCase().replace(/^#+/,'').replace(/\s+/g,'-').replace(/[^\p{L}\p{N}-]/gu,'').slice(0,20);
function recentTags(){const seen=[];[...expenses].sort((a,b)=>b.date.localeCompare(a.date)||b.id-a.id).forEach(e=>(e.tags||[]).forEach(t=>{if(!seen.includes(t))seen.push(t)}));
  TAGS.forEach(t=>{if(!seen.includes(t))seen.push(t)});return seen}
const tagRow=e=>e.tags&&e.tags.length?`<span class="tagrow">${e.tags.map(t=>`<span class="tagc">#${esc(t)}</span>`).join('')}</span>`:'';
const MONTH=TODAY.slice(0,7), DIM=new Date(+TODAY.slice(0,4),+TODAY.slice(5,7),0).getDate(), DAYN=+TODAY.slice(8), DAYS_LEFT=DIM-DAYN+1;
const MONTH_NAME=parseL(TODAY).toLocaleDateString('en-IN',{month:'long'}), MON3=MONTH_NAME.slice(0,3);
const visibleTargets=()=>targets.filter(t=>detailed()||t.kind==='overall'||t.kind==='folder').filter(t=>t.kind!=='folder'||(F(t.ref)&&!F(t.ref).archived));
const overallT=()=>targets.find(t=>t.kind==='overall');
function inTarget(e,t){
  if(t.period==='month'&&!e.date.startsWith(MONTH))return false;
  return t.kind==='overall'?true:t.kind==='folder'?desc(t.ref).includes(e.folder):t.kind==='category'?e.cat===t.ref:(e.tags||[]).includes(t.ref);
}
const tItems=t=>expenses.filter(e=>inTarget(e,t));
const tSpent=t=>tItems(t).reduce((a,e)=>a+e.amt,0);
function tName(t,short){
  if(t.kind==='overall')return short?`${MON3} target`:`${MONTH_NAME} · everything`;
  if(t.kind==='folder')return `${F(t.ref).name}${short?' target':''}`;
  if(t.kind==='category')return `${CATS[t.ref].name}${short?' limit':''}`;
  return `#${t.ref}${short?' limit':''}`;
}
function tStat(t,extra=0){
  const spent=tSpent(t)+extra,left=t.amt-spent,pct=t.amt?spent/t.amt:0;
  const st=spent>t.amt?'over':pct>=.85?'warn':'ok';
  const perDay=t.period==='month'?Math.max(0,left)/DAYS_LEFT:null;
  return{spent,left,pct,st,perDay};
}
const ST_LBL={ok:'On track',warn:'Close to limit',over:'Over',inh:'Follows parent'};
const paceTxt=(t,s)=>s.left<0?`over by ${money0(-s.left)}`:t.period==='month'?`${money0(s.left)} left · ${money0(s.perDay)}/day for ${DAYS_LEFT} days`:`${money0(s.left)} left · ${Math.round(s.pct*100)}% used`;
function todayInfo(){
  const t=overallT();if(!t)return null;
  const before=tItems(t).filter(e=>e.date<TODAY).reduce((a,e)=>a+e.amt,0);
  const allowance=Math.max(0,t.amt-before)/DAYS_LEFT;
  const today=expenses.filter(e=>e.date===TODAY).reduce((a,e)=>a+e.amt,0);

function childrenOf(node,t){

    if(subs.length){const out=subs.map(x=>({key:'f:'+x.k.id,lvl:'f',fid:x.k.id,label:x.k.name,items:x.its}));

  }
  if(node.lvl!=='g'&&t.kind!=='tag'){const tg=new Map();
    items.forEach(e=>((e.tags&&e.tags.length)?e.tags:['']).forEach(x=>{if(!tg.has(x))tg.set(x,[]);tg.get(x).push(e)}));
    if(tg.size>1||(tg.size===1&&!tg.has('')))return[...tg].sort((a,b)=>b[1].reduce((s,e)=>s+e.amt,0)-a[1].reduce((s,e)=>s+e.amt,0))

  return null;

/* ============ V2: nudges (simulated in-browser; see TECH-REVIEW §9 for real platforms) ============ */
let rem=(()=>{try{const r=JSON.parse(store.get('rem'));if(r&&Array.isArray(r.times)&&Array.isArray(r.days))return r}catch(e){}return null})()
  ||{times:['13:30','20:00'],days:[1,1,1,1,1,1,1],style:'banner',demo:true};
const saveRem=()=>store.set('rem',JSON.stringify(rem));
let lastLogAt=null,lastRemAt=Date.now(),nudgeOn=null,nudgeFocus=null,nudgeLast='';
/* V2r2: `still` = the reason to nudge, re-tested at fire time AND on every deferred retry (logging during the wait cancels it).
   Copy counts pending items (no titles, no amounts: still discreet, §9.4) and offers "Finish N" → the To-sort queue. */
function fireNudge(style=rem.style,sub,still){
  if(still&&!still())return;
  if(draft||sheetOpen()){setTimeout(()=>fireNudge(style,sub,still),10000);return} // never interrupt someone mid-log
  hideNudge(true);
  const el=style==='full'?$('#nudgeF'):$('#nudgeB');nudgeOn=el;
  const n=toSort().length;
  el.querySelectorAll('.nudge-sub').forEach(s=>s.textContent=n?`${n} item${n>1?'s':''} to finish${sub?' · '+sub:''}`:sub||(style==='full'?'A good moment to catch up.':'Reminder'));
  el.querySelectorAll('.nudge-fin').forEach(b=>{b.hidden=!n;const t=b.querySelector('.nf-n');if(t)t.textContent=`Finish ${n}`});
  el.inert=false;el.classList.add('on');buzz([20,60,20]);
  if(style==='full'){nudgeFocus=document.activeElement;setTimeout(()=>el.querySelector('[data-nudge="log"]').focus({preventScroll:true}),80)}
  emit('nudge',{style});
}
function hideNudge(silent){
  const wasFull=nudgeOn&&nudgeOn.id==='nudgeF';
  [$('#nudgeB'),$('#nudgeF')].forEach(el=>{el.classList.remove('on');el.inert=true});nudgeOn=null;
  if(wasFull&&!silent&&nudgeFocus&&nudgeFocus.isConnected)nudgeFocus.focus({preventScroll:true});
}
function nudgeAct(a,snz){
  const style=nudgeOn&&nudgeOn.id==='nudgeF'?'full':'banner';hideNudge();
  if(a==='log'){if(sheetOpen())closeSheet();setTimeout(()=>openAdd(),220)}
  else if(a==='sort'){if(sheetOpen())closeSheet();setTimeout(()=>openSortQ(),220)}
  else if(snz){setTimeout(()=>fireNudge(style,'Snoozed reminder'),snz*1000);snack(`Snoozed — back in ${snz}s (demo; real: ${snz} min)`)}
}
setInterval(()=>{ // real schedule against local time
  const d=new Date(),hm=String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0'),key=d.toDateString()+hm;
  if(!rem.days[(d.getDay()+6)%7]||!rem.times.includes(hm)||nudgeLast===key)return;nudgeLast=key;
  // fire if nothing was logged since the last reminder, OR (at the day's last reminder) anything is still to sort:
  // a lone quick add no longer silences the evening "finish it" moment
  const since=lastRemAt,isLast=hm===[...rem.times].sort().pop();
  const still=()=>!lastLogAt||lastLogAt<since||(isLast&&toSort().length>0);
  fireNudge(rem.style,`Reminder · ${hm}`,still);lastRemAt=Date.now();
},15000);
setTimeout(()=>{if(rem.demo&&!nudgeOn)fireNudge(rem.style,'Demo',()=>!lastLogAt&&!nudgeOn)},20000);
document.addEventListener('keydown',e=>{
  if(!nudgeOn)return;
  if(e.key==='Escape'){e.stopImmediatePropagation();e.preventDefault();hideNudge();return}
  if(nudgeOn.id==='nudgeF'&&e.key==='Tab'){const f=[...nudgeOn.querySelectorAll('button')];const a=f[0],z=f[f.length-1];
    if(!nudgeOn.contains(document.activeElement)){e.preventDefault();a.focus()}
    else if(e.shiftKey&&document.activeElement===a){e.preventDefault();z.focus()}else if(!e.shiftKey&&document.activeElement===z){e.preventDefault();a.focus()}
    e.stopImmediatePropagation()}
},true);

/* ============ Snackbar & confetti ============ */
let snackT;

    if(hot>=0){$('#dialLayer').textContent='Release for';$('#dialVal').textContent=LAY[menu.children[hot].dataset.l].name}}
  const reset=()=>{clearTimeout(holdT);D.classList.remove('pressed','turning','menu');mode=null;hot=-1;dead=0};
  D.addEventListener('pointerdown',e=>{
    e.preventDefault();D.setPointerCapture(e.pointerId);sx=e.clientX;sy=e.clientY;dead=0;
    const c=$('.coach');if(c){c.remove();store.set('coach','1')}
    const{r,a}=polar(e);prevA=a;lx=sx;ly=sy;dial.lastMoveT=performance.now(); // stroke clock starts at touch-down
    if(r<(D.offsetWidth<140?26:32)){mode='press';D.classList.add('pressed');lx=sx;ly=sy;holdT=setTimeout(()=>{if(mode==='press'&&Math.hypot(lx-sx,ly-sy)<8)openMenu()},380)}
    else{mode='pre';dialUI(true)}
  });
  D.addEventListener('pointermove',e=>{
    if(!mode)return;lx=e.clientX;ly=e.clientY;const{a,r}=polar(e);
    if(mode==='menu')return pickHot(e);
    const moved=Math.hypot(e.clientX-sx,e.clientY-sy);
    if(mode==='press'){if(moved<8)return;clearTimeout(holdT);D.classList.remove('pressed');mode='pre';prevA=a}
    if(r<20){prevA=a;return} // angle is unstable near the centre
    let d=a-prevA;if(d>180)d-=360;if(d<-180)d+=360;prevA=a;
    if(mode==='pre'){dead+=d;if(Math.abs(dead)<6)return;mode='turn';D.classList.add('turning');d=dead;dial.strokeT=performance.now();
      if(dial.step>1&&!dial.kept)dial.kept=dial.step} // remember the pre-regrip step
    turn(d);
  });
  D.addEventListener('pointerup',()=>{
    unlockFeedback();
    const m=mode,h=hot,L=[...menu.children],ringTap=m==='pre'&&Math.hypot(lx-sx,ly-sy)<12;reset();
    if(m==='press')onCoreTap();
    else if(ringTap){if(!dialToggleTag())onCoreTap()} // a press on the ring band: toggle tag (Tags layer) or act like the centre
    else if(m==='menu'){if(h>=0)setLayer(L[h].dataset.l);else dialUI(true)}
  });
  D.addEventListener('pointercancel',reset); // never treated as a tap
  let wAcc=0;D.addEventListener('wheel',e=>{e.preventDefault();wAcc+=e.deltaY*(e.deltaMode===1?33:e.deltaMode===2?400:1);const det=LAY[dial.layer].det;while(Math.abs(wAcc)>=100){const n=Math.sign(wAcc);wAcc-=n*100;turn(n*det)}},{passive:false});
  D.addEventListener('keydown',e=>{unlockFeedback();
    const k={ArrowRight:1,ArrowUp:1,ArrowLeft:-1,ArrowDown:-1}[e.key];
    if(k){e.preventDefault();dial.vel=0;dial.step=1;dialStep(k)}
    else if(e.key==='PageUp'||e.key==='PageDown'){e.preventDefault();const was=dial.step;dial.step=dial.layer==='amount'?100:1;dialStep(e.key==='PageUp'?(dial.layer==='amount'?1:10):(dial.layer==='amount'?-1:-10));dial.step=was}
    else if(e.key==='Enter'&&e.shiftKey){e.preventDefault();if(canCommit())dialCommit()}
    else if(e.key===' '&&dial.layer==='tags'){e.preventDefault();dialToggleTag()}
    else if(e.key==='Enter'||e.key===' '){e.preventDefault();dialTap()}
    else if(e.key==='l'||e.key==='L'){e.preventDefault();const L=draft?tapOrder():dialLayers();setLayer(L[(L.indexOf(dial.layer)+1)%L.length])}});
})();
function coach(){
  if(store.get('coach')||fine)return;
  if($('.coach'))return;const c=document.createElement('div');c.className='coach';c.setAttribute('role','note');
  c.innerHTML=`<b>Thumb dial (optional)</b>Turn the ring to move or change a value. Tap the centre to open or go to the next field. <b style="display:inline">Double-tap</b> saves. Hold the centre and slide to switch what it controls.<br><button>Got it</button>`;
  c.querySelector('button').onclick=()=>{c.remove();store.set('coach','1')};document.body.appendChild(c);
}
/* ============ V2: horizontal page swipe (Folders → Activity → Trends) with rubber-band edges ============ */
(()=>{
  const M=$('#main');let s=null,swallow=false;
  const inner=()=>M.querySelector('.inner');
  const rubber=dx=>Math.sign(dx)*Math.pow(Math.abs(dx),.72)*(.7+.25*prefs.bounce);
  M.addEventListener('pointerdown',e=>{
    if(e.pointerType==='mouse'&&fine)return;if(sheetOpen()||e.button>0)return;
    const pi=PAGES.indexOf(route.v);if(pi<0||(route.d&&route.d.length))return;
    if(e.target.closest('.subs,.crumbs,.chips,.xs,input,[data-noswipe]'))return;
    s={x:e.clientX,y:e.clientY,t:performance.now(),id:e.pointerId,on:false,pi,dx:0};
  });
  M.addEventListener('pointermove',e=>{
    if(!s||e.pointerId!==s.id)return;const dx=e.clientX-s.x,dy=e.clientY-s.y;
    if(!s.on){if(Math.abs(dx)<12)return;if(Math.abs(dx)<Math.abs(dy)*1.3){s=null;return}
      s.on=true;clearTimeout(lpT);try{M.setPointerCapture(e.pointerId)}catch(x){}const i=inner();if(i)i.style.transition='none'}
    s.dx=dx;const edge=(dx>0&&s.pi===0)||(dx<0&&s.pi===PAGES.length-1);
    const i=inner();if(i)i.style.transform=`translateX(${edge?rubber(dx):dx*.9}px)`;
  });
  const end=e=>{
    if(!s||(e&&e.pointerId!==s.id))return;const w=s;s=null;if(!w.on)return;
    swallow=true;setTimeout(()=>swallow=false,60);
    const v=w.dx/Math.max(1,performance.now()-w.t),dir=w.dx<0?1:-1,to=w.pi+dir;
    const i=inner();
    if((Math.abs(w.dx)>70||Math.abs(v)>.45)&&to>=0&&to<PAGES.length){buzz(8);go({v:PAGES[to]},dir>0?'fwd':'back')}
    else if(i){i.style.transition=`transform calc(.55s + .2s * var(--bounce)) var(--spring)`;i.style.transform='';buzz(4)}
  };
  M.addEventListener('pointerup',end);M.addEventListener('pointercancel',e=>{if(s&&e.pointerId===s.id){const i=inner();if(i){i.style.transition='';i.style.transform=''}s=null}});
  document.addEventListener('click',e=>{if(swallow){e.stopPropagation();e.preventDefault();swallow=false}},true);
})();

document.body.classList.toggle('dial-left',dial.left);
try{history.replaceState({r:route},'')}catch(e){}
addEventListener('popstate',e=>{
  if(sheetOpen()){closeSheet();try{history.pushState({r:route},'')}catch(x){}return} // Back closes the sheet first
  go((e.state&&e.state.r)||{v:'home'},'back',true);
});
document.body.classList.toggle('dial-on',dial.on);
render();
if(dial.on){dialCtx();setTimeout(coach,800)}
</script>
